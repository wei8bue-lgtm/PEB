# ══════════════════════════════════════════════════════════════
# WICHTIG: macht den App-Start unabhängig von Elasticsearch
# ══════════════════════════════════════════════════════════════
# Ohne dies instanziiert Spring beim Hochfahren JEDES Singleton-Bean
# eager - inkl. der Elasticsearch-Repository-/Client-Beans. Ist ES dann
# nicht erreichbar, scheitert die GESAMTE App-Startup, auch für
# Business-Services, die mit Suche nichts zu tun haben (siehe die
# mehreren "Failed to instantiate SimpleElasticsearchRepository"-Fehler).
#
# spring.main.lazy-initialization=true weist Spring Boot an, ALLE Beans
# erst bei ihrer ersten tatsächlichen Verwendung zu erzeugen statt beim
# Start. Damit hängt der App-Start nicht mehr von ES ab; ein ES-Ausfall
# wirkt sich erst aus, wenn tatsächlich eine Suchfunktion aufgerufen
# wird - und das ist bereits über try-catch in SearchIndexService
# abgesichert (siehe SEARCH_INTEGRATION.md).
#
# TRADE-OFF, bitte einmal bewusst gegenprüfen: das betrifft ALLE Beans
# der Anwendung, nicht nur die Suche. Der erste Request, der eine
# bestimmte Bean-Kette erstmals braucht, ist minimal langsamer (einmalige
# Erzeugung). Falls Sie z.B. @Scheduled-Tasks oder CommandLineRunner/
# ApplicationRunner-Beans haben, die zwingend SOFORT beim Start laufen
# sollen (nicht erst bei erster Nutzung), kurz verifizieren, dass sich
# deren Verhalten dadurch nicht unerwünscht ändert.
spring.main.lazy-initialization=true


