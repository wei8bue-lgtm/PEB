# ── Anwendung ──────────────────────────────────────────────────
spring.application.name=PEB - Production Engineering Backbone

# ── Server & SSL ───────────────────────────────────────────────
server.port=8444
server.http.port=8100

# Keystore-Konfiguration (PKCS12)
server.ssl.enabled=true
server.ssl.key-store=file:D:/PLM/security/peb-keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=dontpanic!
server.ssl.key-alias=peb-ssl

# TLS - nur sichere Protokolle
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# Cipher-Suites (nur starke Verschlüsselung)
server.ssl.ciphers=TLS_AES_128_GCM_SHA256,\
  TLS_AES_256_GCM_SHA384,\
  TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,\
  TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

# ── Session Cookie Sicherheit ──────────────────────────────────
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

# ── Datenbank - Oracle ─────────────────────────────────────────
spring.datasource.url=jdbc:oracle:thin:@//rngvm01428.de.bosch.com:1521/PEB4
spring.datasource.username=peb_user
spring.datasource.password=peb_user
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ── JPA/Hibernate ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ── Connection Pool ────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── Active Directory (SSO) - Multi-Domain ──────────────────────
# Login-Formate:
#   WEI8BUE           -> Standard-Domain (DE)
#   DE\wei8bue        -> explizit deutsche Domain
#   APAC\wei8bue1     -> APAC, sobald die Platzhalter ersetzt und aktiviert sind
#
# Mehrere Domain Controller werden mit Leerzeichen getrennt. Die Werte für
# APAC und EMEA sind absichtlich deaktiviert, bis die AD-Daten vorliegen.
peb.ad.default-domain=DE

# ── DE (aktiv) ─────────────────────────────────────────────────
peb.ad.domains.DE.enabled=true
peb.ad.domains.DE.domain=de.bosch.com
peb.ad.domains.DE.url=ldap://rngbcd02.de.bosch.com:389 ldap://rngbcd02.de.bosch.com:389
peb.ad.domains.DE.root-dn=dc=de,dc=bosch,dc=com
peb.ad.domains.DE.search-filter=(&(objectClass=user)(sAMAccountName={1}))

# ── APAC (Platzhalter, derzeit deaktiviert) ────────────────────
# Benötigte Informationen: DNS-Domain, Domain Controller und Root-DN.
peb.ad.domains.APAC.enabled=true
peb.ad.domains.APAC.domain=apac.bosch.com
peb.ad.domains.APAC.url=ldap://SGPBCD3012.APAC.bosch.com:389
peb.ad.domains.APAC.root-dn=dc=apac,dc=bosch,dc=com
peb.ad.domains.APAC.search-filter=(&(objectClass=user)(sAMAccountName={1}))

# ── EMEA (Platzhalter, derzeit deaktiviert) ────────────────────
# Benötigte Informationen: DNS-Domain, Domain Controller und Root-DN.
peb.ad.domains.EMEA.enabled=true
peb.ad.domains.EMEA.domain=emea.bosch.com
peb.ad.domains.EMEA.url=ldap://RNGBCD3007.emea.bosch.com:389
peb.ad.domains.EMEA.root-dn=dc=emea,dc=bosch,dc=com
peb.ad.domains.EMEA.search-filter=(&(objectClass=user)(sAMAccountName={1}))

