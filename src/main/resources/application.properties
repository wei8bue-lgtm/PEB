# ══════════════════════════════════════════════════════════════
# PEB - Production Engineering Backbone
# Haupt-Konfiguration
# ══════════════════════════════════════════════════════════════

# ── Anwendung ─────────────────────────────────────────────────
spring.application.name=PEB - Production Engineering Backbone
server.port=8100

# ── Datenbank - Oracle ─────────────────────────────────────────
spring.datasource.url=jdbc:oracle:thin:@//rngvm01428.de.bosch.com:1521/PEB2
spring.datasource.username=peb_user
spring.datasource.password=peb_user
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ── JPA/Hibernate ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Connection Pool ────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── E-Mail ─────────────────────────────────────────────────────
spring.mail.host=smtp.company.com
spring.mail.port=587
spring.mail.username=peb-system@company.com
spring.mail.password=email_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Datei-Upload ───────────────────────────────────────────────
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true
peb.dataset.upload-dir=data/uploads/

# ── Fehlerseiten ───────────────────────────────────────────────
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true
server.error.path=/error

# ── Actuator ───────────────────────────────────────────────────

# Endpunkte freigeben
management.endpoints.web.exposure.include=health,info,metrics,env

# Endpunkt-Details
management.endpoint.health.show-details=when-authorized
management.endpoint.env.show-values=when-authorized

# Basis-Pfad (optional, Standard: /actuator)
management.endpoints.web.base-path=/actuator

# ── LDAP ───────────────────────────────────────────────────────
spring.ldap.urls=ldap://your-ldap-server:389
spring.ldap.base=dc=company,dc=com
spring.ldap.username=cn=admin,dc=company,dc=com
spring.ldap.password=admin-password

# ── Request Mapping ────────────────────────────────────────────
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# ── Logging ────────────────────────────────────────────────────
logging.level.com.peb=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.com.peb.controller.StructureController=DEBUG

# ── 3D Viewer ─────────────────────────────────────────────────
# Pfad zum JT-Konverter (leer = Fallback-Modus)
# Beispiel Windows: peb.viewer.converter.path=C:/tools/jt2gltf/jt2gltf.exe
# Beispiel Linux:   peb.viewer.converter.path=/opt/jt2gltf/jt2gltf
peb.viewer.converter.path="C:/Program Files/WindowsApps/SiemensPLMSoftware.JT2GoDesktop_2506.0.0.0_x64__qtbmxjdagz8xc/Products/JT2Go/VisView_NG.exe"

# Cache-Verzeichnis für konvertierte GLB-Dateien
peb.viewer.cache-dir=data/viewer-cache/

# LibreOffice Pfad (Windows)
app.libreoffice.path=C:/Program Files/LibreOffice/program/soffice.exe

# Temporäres Verzeichnis für Konvertierungen
app.libreoffice.temp-dir=C:/temp/peb-conversions

# Office Viewer Modus (online / offline)
app.office-viewer=offline

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=50,expireAfterWrite=10m