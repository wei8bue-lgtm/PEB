# Application
spring.application.name=PEB - Production Engineering Backbone
server.port=8100

# Database - Oracle
spring.datasource.url=jdbc:oracle:thin:@//rngvm01428.de.bosch.com:1521/PEB2
spring.datasource.username=peb_user
spring.datasource.password=peb_user
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10

# Email
spring.mail.host=smtp.company.com
spring.mail.port=587
spring.mail.username=peb-system@company.com
spring.mail.password=email_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Logging
logging.level.com.peb=INFO
logging.level.org.springframework.security=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# LDAP
spring.ldap.urls=ldap://your-ldap-server:389
spring.ldap.base=dc=company,dc=com
spring.ldap.username=cn=admin,dc=company,dc=com
spring.ldap.password=admin-password

# Add debug logging for structure
logging.level.com.peb.controller.StructureController=DEBUG

# File Upload
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true

# Dataset storage location
peb.dataset.upload-dir=data/uploads/

# Logging for debugging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Ensure proper request mapping
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true