        .app-layout__content {

                </div>

				<div class="frontend-kit__example-wrapper -primary">

                    <hr class="a-divider" />

                    <!-- Standard actions for all authenticated users) -->

					<button type="button" class="a-button a-button--primary" th:onclick="|window.location.href='@{/designs}'|" >
					  <i class="a-icon a-button__icon boschicon-bosch-ic-mechanic"></i>

					</button>

					<button type="button" class="a-button a-button--primary" th:onclick="|window.location.href='@{/designs}'|" >
					  <i class="a-icon a-button__icon boschicon-bosch-ic-motorcycle-electric-traction-control"></i>
						<span class="a-button__label" th:text="#{menu.edesigns}">E-Designs</span>
					</button>

					<button type="button" class="a-button a-button--primary" th:onclick="|window.location.href='@{/designs}'|" >
					  <i class="a-icon a-button__icon boschicon-bosch-ic-software-tex"></i>
						<span class="a-button__label" th:text="#{menu.sdesigns}">S-Designs</span>
					</button>

					<button type="button" class="a-button a-button--primary" th:onclick="|window.location.href='@{/drawings}'|" >
					  <i class="a-icon a-button__icon boschicon-bosch-ic-picture-in-picture"></i>
						<span class="a-button__label" th:text="#{menu.drawings}">Drawings</span>
					</button>
					
					<hr class="a-divider" />

						<span class="a-button__label" th:text="#{menu.ebom}">eBOM</span>

					<hr class="a-divider" />

						<button type="button" id="reindexSearchBtn" class="a-button a-button--primary">
							<i class="a-icon a-button__icon boschicon-bosch-ic-reset"></i>
							<span class="a-button__label" th:text="#{menu.reindexSearch}">Index Rebuild</span>

						<span id="reindexStatus" style="margin-left:8px; font-size:0.9em;"></span>
                    </sec:authorize>

                </div>
              </div>
            </div>

            <!-- ── Footer (Fragment) ─────────────────────────── -->
            <div th:replace="~{fragments/footer :: footer}"></div>

        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>

    <!-- Reindex-Button: löst POST /api/search/admin/reindex aus -->
    <script sec:authorize="hasRole('ADMIN')" th:inline="javascript">
        (function () {
            const btn = document.getElementById('reindexSearchBtn');
            const status = document.getElementById('reindexStatus');
            if (!btn) return;

            const i18n = {
                confirm: /*[[#{index.reindexConfirm}]]*/ 'Kompletten Suchindex neu aufbauen? Das kann je nach Datenmenge etwas dauern.',
                running: /*[[#{index.reindexRunning}]]*/ 'Reindex läuft...',
                error:   /*[[#{index.reindexError}]]*/ 'Fehler beim Reindex:'
            };

            btn.addEventListener('click', function () {
                if (!confirm(i18n.confirm)) {
                    return;
                }

                const csrfToken  = document.querySelector('meta[name="_csrf"]').content;
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

                btn.disabled = true;
                status.textContent = i18n.running;
                status.style.color = '#555';

                fetch('/api/search/admin/reindex', {
                    method: 'POST',
                    headers: { [csrfHeader]: csrfToken }
                })
                    .then(res => {
                        if (!res.ok) {
                            throw new Error('HTTP ' + res.status);
                        }
                        return res.text();
                    })
                    .then(text => {
                        status.textContent = '✅ ' + text;
                        status.style.color = 'green';
                    })
                    .catch(err => {
                        status.textContent = '❌ ' + i18n.error + ' ' + err.message;
                        status.style.color = 'red';
                    })
                    .finally(() => {
                        btn.disabled = false;
                    });
            });
        })();
    </script>

    <!-- Pending-Badge für Admins via API laden -->
    <script sec:authorize="hasRole('ADMIN')" th:inline="javascript">
        const pendingI18n = {
            usersWaiting: /*[[#{index.pendingUsers}]]*/ 'Benutzer warten auf Freischaltung –',
            activateNow:  /*[[#{index.activateNow}]]*/ 'Jetzt freischalten'
        };

        fetch('/api/admin/users/pending-count')
            .then(r => r.json())
            .then(data => {
                if (data.count > 0) {
                    const badge = document.getElementById('pendingBadge');
                    if (badge) {
                        badge.textContent = data.count;
                        badge.style.display = 'inline';
                    }
                    const alert = document.getElementById('pendingAlert');
                    if (alert) {
                        alert.style.display = 'block';
                        alert.innerHTML = `⚠️ <strong>${data.count}</strong>
                            ${pendingI18n.usersWaiting}
                            <a href="/admin/users?status=PENDING">
                                ${pendingI18n.activateNow}
                            </a>`;
                    }
                }
            })
            .catch(() => {}); // Fehler still ignorieren
    </script>
</body>
</html>
