<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{eclass.catalogTitle}">ECLASS Katalog - PEB</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/brand/styles/frontend-kit-complete.css}">
    <link rel="stylesheet" th:href="@{/css/brand/styles/brands/bosch/styles/semantic/index.css}">
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <style>
        .app-layout { display: flex; align-items: flex-start; }
        .app-layout__content { flex: 1 1 auto; min-width: 0; }
        .eclass-search-box { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
        .eclass-search-box input {
            flex: 1; padding: .55rem .75rem; border: 1px solid #ced4da;
            border-radius: 4px; font-size: .95rem;
        }
        .tree-panel { display: flex; gap: 1rem; }
        .tree-col {
            flex: 1; border: 1px solid #dee2e6; border-radius: 6px;
            padding: .75rem; max-height: 520px; overflow-y: auto;
        }
        .tree-col h4 { margin: 0 0 .5rem; font-size: .85rem; color: #6c757d; text-transform: uppercase; }
        .tree-item {
            display: block; padding: .35rem .5rem; border-radius: 4px;
            cursor: pointer; font-size: .9rem; text-decoration: none; color: inherit;
        }
        .tree-item:hover, .tree-item.active { background: #e8f0fe; color: #1a73e8; }
        .tree-item .code { font-weight: 600; margin-right: .4rem; color: #555; }
        .search-result-list { margin-top: .5rem; }
        .search-result-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: .4rem .6rem; border-radius: 4px; border-bottom: 1px solid #f0f0f0;
        }
        .search-result-item:hover { background: #f8f9fa; }
        .badge-level { font-size: .72rem; padding: .15rem .4rem; border-radius: 3px; color: #fff; }
        .level-1 { background: #6c757d; }
        .level-2 { background: #17a2b8; }
        .level-3 { background: #28a745; }
        .level-4 { background: #007bff; }
        .stat-badge {
            display: inline-block; background: #e8f0fe; color: #1a73e8;
            padding: .2rem .6rem; border-radius: 10px; font-size: .85rem; font-weight: 600;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header(#{eclass.catalogHeading})}"></div>

<div class="app-layout"><div th:replace="~{fragments/side-navigation :: side-navigation}"></div><div class="app-layout__content"><div class="frontend-kit__example-wrapper -secondary"><div class="e-container" style="margin:1rem auto;"><div class="frontend-kit__example-wrapper -primary"><div class="container">

    <!-- Statistik -->
    <div class="card" style="display:flex;gap:2rem;align-items:center;">
        <div>
            <strong th:text="#{eclass.catalogHeading}">ECLASS Katalog</strong> &nbsp;
            <span th:if="${versions != null and !versions.empty}">
                <span th:text="#{eclass.versions}">Version(en):</span>
                <span th:each="v : ${versions}" class="stat-badge" th:text="${v}"></span>
            </span>
            <span th:unless="${versions != null and !versions.empty}" style="color:#888" th:text="#{eclass.noCatalogImported}">
                Noch kein Katalog importiert
            </span>
        </div>
        <div>
            <span class="stat-badge" th:text="${commodityCount} + ' Commodities'"></span>
        </div>
        <div sec:authorize="hasRole('ADMIN')" style="margin-left:auto">
            <button type="button" class="a-button a-button--primary"
                    th:onclick="|window.location.href='@{/eclass/import}'|">
                <i class="a-icon a-button__icon boschicon-bosch-ic-upload"></i>
                <span class="a-button__label" th:text="#{button.importXml}">XML importieren</span>
            </button>
        </div>
    </div>

    <!-- Suche -->
    <div class="card">
        <h3 th:text="#{eclass.classSearch}">Klassensuche</h3>
        <div class="eclass-search-box">
            <input type="text" id="eclassSearch"
                   th:placeholder="#{eclass.searchPlaceholder}" placeholder="Klasse suchen (z.B. Elektromotor, 27-37-04, motor)..."
                   autocomplete="off">
            <button type="button" class="a-button a-button--primary" onclick="doSearch()">
                <i class="a-icon a-button__icon boschicon-bosch-ic-search"></i>
                <span class="a-button__label" th:text="#{button.searchPlain}">Suchen</span>
            </button>
        </div>
        <div id="searchResults" class="search-result-list"></div>
    </div>

    <!-- Hierarchie-Browser -->
    <div class="card">
        <h3 th:text="#{eclass.hierarchyBrowser}">Hierarchie-Browser</h3>
        <p style="color:#888;font-size:.9rem" th:text="#{eclass.clickToLoadSubgroups}">Klicken Sie auf ein Segment um die Untergruppen zu laden.</p>
        <div class="tree-panel">

            <div class="tree-col">
                <h4 th:text="#{eclass.segment}">Segment</h4>
                <div id="colSegment">
                    <div th:if="${segments == null or segments.empty}" style="color:#888" th:text="#{eclass.noCatalog}">
                        Kein Katalog vorhanden.
                    </div>
                    <a th:each="seg : ${segments}"
                       class="tree-item"
                       th:id="'seg-' + ${seg.code}"
                       th:attr="data-code=${seg.code}"
                       href="#"
                       onclick="loadLevel('maingroup', this.getAttribute('data-code'), this); return false;">
                        <span class="code" th:text="${seg.code}"></span>
                        <span th:text="${seg.name} ?: ${seg.nameEn}"></span>
                    </a>
                </div>
            </div>

            <div class="tree-col">
                <h4 th:text="#{eclass.mainGroup}">Hauptgruppe</h4>
                <div id="colMainGroup"><span style="color:#ccc">&larr; <span th:text="#{eclass.selectSegment}">Segment wählen</span></span></div>
            </div>

            <div class="tree-col">
                <h4 th:text="#{eclass.group}">Gruppe</h4>
                <div id="colGroup"><span style="color:#ccc">&larr; <span th:text="#{eclass.selectMainGroup}">Hauptgruppe wählen</span></span></div>
            </div>

            <div class="tree-col">
                <h4 th:text="#{eclass.commodity}">Commodity</h4>
                <div id="colCommodity"><span style="color:#ccc">&larr; <span th:text="#{eclass.selectGroup}">Gruppe wählen</span></span></div>
            </div>

        </div>
    </div>
</div>
 </div></div></div></div></div><div th:replace="~{fragments/footer :: footer}"></div></div></div>

<script th:inline="javascript">
var colMap  = { maingroup:'colMainGroup', group:'colGroup', commodity:'colCommodity' };
var sibCol  = { maingroup:'colSegment',   group:'colMainGroup', commodity:'colGroup' };
var order   = ['maingroup','group','commodity'];
var nextLvl = { maingroup:'group', group:'commodity', commodity:null };
var lvlLabel = [
    '',
    /*[[#{eclass.lvlLabelSegment}]]*/ 'Segment',
    /*[[#{eclass.lvlLabelMainGroup}]]*/ 'Hauptgruppe',
    /*[[#{eclass.lvlLabelGroup}]]*/ 'Gruppe',
    /*[[#{eclass.lvlLabelCommodity}]]*/ 'Commodity'
];
var i18nSelect  = /*[[#{eclass.selectWord}]]*/ 'Wählen';
var i18nLoading = /*[[#{eclass.loading}]]*/ 'Lade...';
var i18nNoEntries = /*[[#{eclass.noEntries}]]*/ 'Keine Einträge';
var i18nError = /*[[#{eclass.errorPrefix}]]*/ 'Fehler:';
var i18nSearching = /*[[#{eclass.searching}]]*/ 'Suche...';
var i18nNoResults = /*[[#{eclass.noResultsFound}]]*/ 'Keine Ergebnisse gefunden.';
var i18nDetail = /*[[#{button.details}]]*/ 'Detail';

function loadLevel(level, parent, clickedEl) {
    document.querySelectorAll('#' + sibCol[level] + ' .tree-item')
            .forEach(function(el) { el.classList.remove('active'); });
    if (clickedEl) clickedEl.classList.add('active');

    var idx = order.indexOf(level);
    for (var i = idx; i < order.length; i++) {
        document.getElementById(colMap[order[i]]).innerHTML =
            '<span style="color:#ccc">&#x2190; ' + i18nSelect + '</span>';
    }

    var col = document.getElementById(colMap[level]);
    col.innerHTML = '<span style="color:#aaa">' + i18nLoading + '</span>';

    fetch('/eclass/browse?level=' + encodeURIComponent(level) + '&parent=' + encodeURIComponent(parent))
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (!data.length) {
                col.innerHTML = '<span style="color:#888">' + i18nNoEntries + '</span>';
                return;
            }
            col.innerHTML = data.map(function(c) {
                var name = c.name || c.nameEn || '';
                if (nextLvl[level]) {
                    return '<a class="tree-item" href="#" onclick="loadLevel(\'' + nextLvl[level] + '\',\'' + escHtml(c.code) + '\',this);return false;">'
                         + '<span class="code">' + escHtml(c.code) + '</span> ' + escHtml(name)
                         + '</a>';
                } else {
                    return '<a class="tree-item" href="/eclass/' + c.id + '">'
                         + '<span class="code">' + escHtml(c.code) + '</span> ' + escHtml(name)
                         + '</a>';
                }
            }).join('');
        })
        .catch(function(err) {
            col.innerHTML = '<span style="color:red">' + i18nError + ' ' + err.message + '</span>';
        });
}

function doSearch() {
    var term = document.getElementById('eclassSearch').value.trim();
    if (!term) return;
    var el = document.getElementById('searchResults');
    el.innerHTML = '<span style="color:#aaa">' + i18nSearching + '</span>';

    fetch('/eclass/search?term=' + encodeURIComponent(term))
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (!data.length) { el.innerHTML = '<p style="color:#888">' + i18nNoResults + '</p>'; return; }
            el.innerHTML = data.map(function(c) {
                var name = c.name || c.nameEn || '';
                var lvl  = c.classLevel || 4;
                return '<div class="search-result-item">'
                     + '<span><span class="badge-level level-' + lvl + '">' + (lvlLabel[lvl]||'') + '</span>'
                     + ' <strong>' + escHtml(c.code) + '</strong> &ndash; ' + escHtml(name) + '</span>'
                     + '<a href="/eclass/' + c.id + '" class="a-link -icon"><span></span><span>' + i18nDetail + '</span></a>'
                     + '</div>';
            }).join('');
        })
        .catch(function(err) {
            el.innerHTML = '<p style="color:red">' + i18nError + ' ' + err.message + '</p>';
        });
}

document.getElementById('eclassSearch').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doSearch();
});

function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
