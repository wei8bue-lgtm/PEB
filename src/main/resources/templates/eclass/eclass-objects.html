<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{eclass.objectsPrefix} + ': ' + ${code} + ' - PEB'">ECLASS Objekte - PEB</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .type-badge {
            display: inline-block; padding: .15rem .5rem; border-radius: 3px;
            font-size: .8rem; font-weight: 600; color: #fff;
        }
        .type-DESIGN    { background: #17a2b8; }
        .type-DRAWING   { background: #17a2b8; }
        .type-MACHINE   { background: #dc3545; }
        .type-SYSTEM    { background: #fd7e14; }
        .type-SUBSYSTEM { background: #007bff; }
        .type-MODULE    { background: #28a745; }
        .type-SUBMODULE { background: #6c757d; }
        .type-PART      { background: #343a40; }
        .type-AUXILIARY { background: #adb5bd; color: #333; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo-placeholder">PEB</div>
    <h1>ECLASS: <span th:text="${code}"></span></h1>
    <div style="margin-left:auto;display:flex;align-items:center;gap:16px;">
        <span sec:authentication="name" class="user-info"></span>
        <a th:href="@{/eclass}" class="btn btn-secondary">← <span th:text="#{button.catalog}">Katalog</span></a>
    </div>
</div>

<div class="container">
    <div class="card">
        <h3>
            <span th:text="#{eclass.allPebObjectsWith}">Alle PEB-Objekte mit ECLASS</span> <strong th:text="${code}"></strong>
            &nbsp;<span style="color:#888;font-size:.9rem"
                        th:text="'(' + #{eclass.objectsCount(${objects.size()})} + ')'"></span>
        </h3>

        <div th:if="${objects.empty}" style="color:#888;padding:1rem 0" th:text="#{eclass.noObjectsClassified}">
            Noch keine Objekte mit diesem ECLASS-Code klassifiziert.
        </div>

        <table class="table" th:unless="${objects.empty}">
            <thead>
                <tr>
                    <th th:text="#{label.id}">ID</th>
                    <th th:text="#{label.type}">Typ</th>
                    <th th:text="#{label.name}">Name</th>
                    <th th:text="#{label.department}">Abteilung</th>
                    <th th:text="#{label.action}">Aktion</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="obj : ${objects}">
                    <td><code th:text="${obj.objectId}"></code></td>
                    <td>
                        <span class="type-badge"
                              th:classappend="'type-' + ${obj.objectType}"
                              th:text="${obj.objectType}"></span>
                    </td>
                    <td th:text="${obj.objectName}"></td>
                    <td th:text="${obj.objectDepartment}"></td>
                    <td>
                        <a th:href="${obj.detailUrl}" class="btn btn-sm btn-secondary" th:text="#{button.open}">Öffnen</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
