<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{eclass.detailTitle}">ECLASS Klassen-Detail - PEB</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/brand/styles/frontend-kit-complete.css}">
    <link rel="stylesheet" th:href="@{/css/brand/styles/brands/bosch/styles/semantic/index.css}">
    <style>
        .app-layout { display: flex; align-items: flex-start; }
        .app-layout__content { flex: 1 1 auto; min-width: 0; }
        .irdi-badge {
            font-family: monospace; background: #f8f9fa; border: 1px solid #dee2e6;
            padding: .15rem .5rem; border-radius: 3px; font-size: .85rem;
        }
        .prop-table th { width: 35%; background: #f8f9fa; }
        .hierarchy-path {
            display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem;
        }
        .hierarchy-step {
            display: flex; align-items: center; gap: .3rem;
            background: #e8f0fe; padding: .2rem .6rem; border-radius: 12px; font-size: .85rem;
        }
        .hierarchy-step .code { font-weight: 700; color: #1a73e8; }
        .sep { color: #aaa; }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header(#{eclass.detailHeading})}"></div>

<div class="app-layout"><div th:replace="~{fragments/side-navigation :: side-navigation}"></div><div class="app-layout__content"><div class="frontend-kit__example-wrapper -secondary"><div class="e-container" style="margin:1rem auto;"><div class="frontend-kit__example-wrapper -primary"><div class="container">

    <!-- Hierarchie-Pfad -->
    <div class="card">
        <div class="hierarchy-path">
            <div class="hierarchy-step" th:if="${eclassClass.segment != null}">
                <span class="code" th:text="${eclassClass.segment}"></span>
                <span th:text="#{eclass.segment}">Segment</span>
            </div>
            <span class="sep" th:if="${eclassClass.mainGroup != null}">›</span>
            <div class="hierarchy-step" th:if="${eclassClass.mainGroup != null}">
                <span class="code" th:text="${eclassClass.mainGroup}"></span>
                <span th:text="#{eclass.mainGroup}">Hauptgruppe</span>
            </div>
            <span class="sep" th:if="${eclassClass.groupCode != null}">›</span>
            <div class="hierarchy-step" th:if="${eclassClass.groupCode != null}">
                <span class="code" th:text="${eclassClass.groupCode}"></span>
                <span th:text="#{eclass.group}">Gruppe</span>
            </div>
            <span class="sep" th:if="${eclassClass.classLevel == 4}">›</span>
            <div class="hierarchy-step" th:if="${eclassClass.classLevel == 4}"
                 style="background:#1a73e8;color:#fff">
                <span class="code" style="color:#fff" th:text="${eclassClass.code}"></span>
                <span th:text="#{eclass.commodity}">Commodity</span>
            </div>
        </div>

        <!-- Hauptattribute -->
        <table class="m-table">
            <tr>
                <th th:text="#{eclass.code}">ECLASS-Code</th>
                <td><strong th:text="${eclassClass.code}"></strong></td>
                <th th:text="#{label.version}">Version</th>
                <td th:text="${eclassClass.version}"></td>
            </tr>
            <tr>
                <th>Name (DE)</th>
                <td th:text="${eclassClass.name}"></td>
                <th>Name (EN)</th>
                <td th:text="${eclassClass.nameEn}"></td>
            </tr>
            <tr>
                <th>IRDI</th>
                <td><span class="irdi-badge" th:text="${eclassClass.irdi}"></span></td>
                <th th:text="#{eclass.level}">Ebene</th>
                <td th:text="${eclassClass.classLevel == 1 ? #messages.msg('eclass.segment') :
                               eclassClass.classLevel == 2 ? #messages.msg('eclass.mainGroup') :
                               eclassClass.classLevel == 3 ? #messages.msg('eclass.group') : #messages.msg('eclass.commodity')}"></td>
            </tr>
            <tr th:if="${eclassClass.definition != null}">
                <th th:text="#{eclass.definitionLabel}">Definition</th>
                <td colspan="3" th:text="${eclassClass.definition}"></td>
            </tr>
            <tr th:if="${eclassClass.keywords != null}">
                <th th:text="#{eclass.keywords}">Schlagwörter</th>
                <td colspan="3" th:text="${eclassClass.keywords}"></td>
            </tr>
        </table>

        <!-- Objekte dieser Klasse -->
        <button type="button" class="a-button a-button--primary"
                th:onclick="|window.location.href='@{'/eclass/objects/' + ${eclassClass.code}}'|">
            <i class="a-icon a-button__icon boschicon-bosch-ic-search"></i>
            <span class="a-button__label" th:text="#{eclass.showAllObjectsOfClass}">Alle Objekte dieser Klasse anzeigen</span>
        </button>
    </div>

    <!-- Merkmale / Properties -->
    <div class="card" th:if="${eclassClass.properties != null and !eclassClass.properties.empty}">
        <h3><span th:text="#{eclass.propertiesHeading}">Merkmale</span> (<span th:text="${eclassClass.properties.size()}"></span>)</h3>
        <table class="m-table prop-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>IRDI</th>
                    <th>Name (DE)</th>
                    <th>Name (EN)</th>
                    <th th:text="#{eclass.unitHeader}">Einheit</th>
                    <th th:text="#{eclass.dataType}">Datentyp</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="prop, stat : ${eclassClass.properties}">
                    <td th:text="${stat.count}"></td>
                    <td><span class="irdi-badge" th:text="${prop.irdi}"></span></td>
                    <td th:text="${prop.name}"></td>
                    <td th:text="${prop.nameEn}"></td>
                    <td th:text="${prop.unit}"></td>
                    <td th:text="${prop.dataType}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="card" th:unless="${eclassClass.properties != null and !eclassClass.properties.empty}">
        <p style="color:#888" th:text="#{eclass.noPropertiesForClass}">Keine Merkmale für diese Klasse definiert (BASIC-Import oder Klasse ohne Merkmale).</p>
    </div>

</div>
 </div></div></div></div></div><div th:replace="~{fragments/footer :: footer}"></div></div></div>
</body>
</html>
