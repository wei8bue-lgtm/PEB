<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? #{plantBop.editTitle} : #{plantBop.newTitle}">
        Plant BOP – PEB
    </title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="header">
    <div class="logo-placeholder">PEB</div>
    <h1 th:text="${isEdit} ? #{plantBop.editHeading} : #{plantBop.newHeading}">
        Plant BOP
    </h1>
    <div style="margin-left:auto;">
        <a th:href="${isEdit} ? @{/plant-bop/{id}(id=${plantBOP.id})} : @{/plant-bop}"
           class="btn btn-primary">← <span th:text="#{button.back}">Zurück</span></a>
    </div>
</div>

<div class="container">
<div class="card" style="max-width:700px;">

    <!-- Info-Banner im Edit-Modus -->
    <div th:if="${isEdit}"
         style="background:#e7f3ff;border-left:4px solid #0056b3;
                padding:.75rem 1rem;border-radius:4px;
                margin-bottom:1.5rem;font-size:.9rem;">
        <strong>✏️ <span th:text="#{mfgBom.editModeLabel}">Bearbeitungsmodus</span></strong> –
        <span th:text="#{plantBop.idLabel}">Plant BOP ID:</span> <code th:text="${plantBOP.id}"></code>
        &nbsp;|&nbsp; <span th:text="#{lifecycle.history.createdBy}">Erstellt von</span>:
        <span th:text="${plantBOP.createdBy ?: '—'}"></span>
    </div>

    <!-- ── Speichern-Formular ──────────────────────────────── -->
    <form th:action="${isEdit} ? @{/plant-bop/{id}/edit(id=${plantBOP.id})} : @{/plant-bop/new}"
          method="post">

        <!-- Name -->
        <div class="form-group">
            <label th:text="#{label.name} + ' *'">Name *</label>
            <input type="text"
                   name="name"
                   th:value="${plantBOP.name}"
                   required
                   th:placeholder="#{label.namePlaceholderPlant}"
                   placeholder="z.B. Plant BOP – Werk Stuttgart">
        </div>

        <!-- Werkscode -->
        <div class="form-group">
            <label th:text="#{label.plantCode}">Werkscode / Standortkennung</label>
            <input type="text"
                   name="plantCode"
                   th:value="${plantBOP.plantCode}"
                   th:placeholder="#{label.plantCodePlaceholder}"
                   placeholder="z.B. STG-01, BLN-02">
            <small style="color:#6c757d;font-size:.82rem;" th:text="#{plantBop.plantCodeHint}">
                Optionaler Bezeichner für das Werk oder den Standort.
            </small>
        </div>

        <!-- Version -->
        <div class="form-group">
            <label th:text="#{label.version}">Version</label>
            <input type="text"
                   name="bopVersion"
                   th:value="${plantBOP.bopVersion ?: '01'}"
                   placeholder="01">
        </div>

        <!-- Beschreibung -->
        <div class="form-group">
            <label th:text="#{label.description}">Beschreibung</label>
            <textarea name="description"
                      rows="4"
                      th:placeholder="#{label.descriptionPlaceholderPlant}"
                      placeholder="Beschreibung der Plant BOP…"
                      style="width:100%;padding:.5rem;
                             border:1px solid #ddd;
                             border-radius:4px;
                             font-family:inherit;
                             resize:vertical;"
                      th:text="${plantBOP.description}">
            </textarea>
        </div>

        <!-- Hinweis nur bei Neu -->
        <div th:unless="${isEdit}"
             style="background:#f0f4ff;border:1px solid #c8d8ff;
                    border-radius:6px;padding:1rem;
                    margin-bottom:1rem;font-size:.85rem;">
            <strong>💡 <span th:text="#{label.note} + ':'">Hinweis:</span></strong>
            <span th:text="#{plantBop.newHint}">Nach dem Erstellen
            kannst du die Baumstruktur mit Ordnern, Product BOPs,
            Manufacturing BOMs und BOEs befüllen.</span>
        </div>

        <!-- Buttons -->
        <div style="display:flex;gap:.5rem;margin-top:1.5rem;">
            <button type="submit" class="btn btn-primary">
                <span th:text="${isEdit} ? #{button.saveChangesIcon} : #{button.saveIcon}"></span>
            </button>
            <a th:href="${isEdit} ? @{/plant-bop/{id}(id=${plantBOP.id})} : @{/plant-bop}"
               class="btn btn-primary"
               style="background:#6c757d;" th:text="#{button.cancelX}">
                ✖ Abbrechen
            </a>
        </div>

    </form>
    <!-- ── Ende Speichern-Formular ─────────────────────────── -->

</div>
</div>
</body>
</html>
