<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Neue Plant BOP – PEB</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="header">
    <div class="logo-placeholder">PEB</div>
    <h1>➕ Neue Plant BOP</h1>
    <div style="margin-left:auto;">
        <a th:href="@{/plant-bop}"
           class="btn btn-primary">← Zurück</a>
    </div>
</div>

<div class="container">
    <div class="card" style="max-width:700px;">

        <form th:action="@{/plant-bop/new}"
              th:object="${plantBOP}"
              method="post">

            <div class="form-group">
                <label>Name *</label>
                <input type="text"
                       th:field="*{name}"
                       required
                       placeholder="z.B. Plant BOP – Werk Stuttgart">
            </div>

            <div class="form-group">
                <label>Werkscode / Standortkennung</label>
                <input type="text"
                       th:field="*{plantCode}"
                       placeholder="z.B. STG-01, BLN-02">
                <small style="color:#6c757d;font-size:.82rem;">
                    Optionaler Bezeichner für das Werk oder den Standort.
                </small>
            </div>

            <div class="form-group">
                <label>Version</label>
                <input type="text"
                       th:field="*{bopVersion}"
                       placeholder="01">
            </div>

            <div class="form-group">
                <label>Beschreibung</label>
                <textarea th:field="*{description}"
                          rows="4"
                          placeholder="Beschreibung der Plant BOP,
z.B. Fertigungslinie für Akkubohrmaschinen im Werk Stuttgart, Halle 3"
                          style="width:100%;padding:.5rem;
                                 border:1px solid #ddd;
                                 border-radius:4px;
                                 font-family:inherit;
                                 resize:vertical;">
                </textarea>
            </div>

            <div style="background:#f0f4ff;border:1px solid #c8d8ff;
                        border-radius:6px;padding:1rem;
                        margin-bottom:1rem;font-size:.85rem;">
                <strong>💡 Hinweis:</strong> Nach dem Erstellen
                kannst du die Baumstruktur mit Ordnern (Hallen,
                Linien, Werke), Product BOPs, Manufacturing BOMs
                und BOEs befüllen.
            </div>

            <div style="display:flex;gap:.5rem;">
                <button type="submit"
                        class="btn btn-primary">
                    💾 Speichern
                </button>
                <a th:href="@{/plant-bop}"
                   class="btn btn-primary"
                   style="background:#6c757d;">
                    ✖ Abbrechen
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
