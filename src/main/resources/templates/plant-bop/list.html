<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Plant BOP – PEB</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="header">
    <div class="logo-placeholder">PEB</div>
    <h1>🏭 Plant BOP</h1>
    <div style="margin-left:auto; display:flex; gap:.5rem;">
        <a th:href="@{/}" class="btn btn-primary">🏠 Home</a>
    </div>
</div>

<div class="container">

    <!-- ── Flash ─────────────────────────────────────────────── -->
    <div th:if="${successMessage}" class="card"
         style="background:#d4edda; border-color:#c3e6cb;
                padding:1rem; margin-bottom:1rem;">
        <p style="margin:0; color:#155724;"
           th:text="${successMessage}"></p>
    </div>
    <div th:if="${errorMessage}" class="card"
         style="background:#f8d7da; border-color:#f5c6cb;
                padding:1rem; margin-bottom:1rem;">
        <p style="margin:0; color:#721c24;"
           th:text="${errorMessage}"></p>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between;
                    align-items:center; margin-bottom:1rem;">
            <h2 style="margin:0;">Plant BOP Liste</h2>
            <a th:href="@{/plant-bop/new}"
               class="btn btn-primary"
               sec:authorize="hasAuthority('WRITE')">
                ➕ Neue Plant BOP
            </a>
        </div>

        <!-- ── Tabelle ───────────────────────────────────────── -->
        <table style="width:100%; border-collapse:collapse;">
            <thead>
                <tr style="background:#f8f9fa;
                           border-bottom:2px solid #ddd;">
                    <th style="padding:.75rem; text-align:left;">
                        ID
                    </th>
                    <th style="padding:.75rem; text-align:left;">
                        Name
                    </th>
                    <th style="padding:.75rem; text-align:left;">
                        Werk
                    </th>
                    <th style="padding:.75rem; text-align:left;">
                        Version
                    </th>
                    <th style="padding:.75rem; text-align:left;">
                        Status
                    </th>
                    <th style="padding:.75rem; text-align:left;">
                        Knoten
                    </th>
                    <th style="padding:.75rem; text-align:left;">
                        Erstellt von
                    </th>
                    <th style="padding:.75rem; text-align:left;">
                        Erstellt am
                    </th>
                    <th style="padding:.75rem; text-align:left;">
                        Aktionen
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(plantBOPs)}">
                    <td colspan="9"
                        style="padding:2rem; text-align:center;
                               color:#6c757d;">
                        Keine Plant BOPs vorhanden.
                    </td>
                </tr>

                <tr th:each="pbop : ${plantBOPs}"
                    style="border-bottom:1px solid #eee;">

                    <!-- ID -->
                    <td style="padding:.75rem;
                               font-family:monospace;
                               font-weight:600;"
                        th:text="${pbop.id}">
                    </td>

                    <!-- Name -->
                    <td style="padding:.75rem;">
                        <a th:href="@{/plant-bop/{id}(id=${pbop.id})}"
                           th:text="${pbop.name}"
                           style="color:#0066cc; font-weight:500;
                                  text-decoration:none;">
                        </a>
                    </td>

                    <!-- Werk -->
                    <td style="padding:.75rem; font-size:.85rem;"
                        th:text="${pbop.plantCode ?: '—'}">
                    </td>

                    <!-- Version -->
                    <td style="padding:.75rem; text-align:center;">
                        <span style="font-size:.8rem;
                                     padding:2px 8px;
                                     background:#e9ecef;
                                     border-radius:10px;"
                              th:text="${pbop.bopVersion}">01</span>
                    </td>

                    <!-- Status -->
                    <td style="padding:.75rem;">
                        <th:block th:with="sn=${pbop.latestStatusName}">
                            <span th:if="${sn == 'WORKING'}"
                                  style="display:inline-block;
                                         padding:.25rem .6rem;
                                         border-radius:4px;
                                         font-size:.8rem;
                                         font-weight:600;
                                         background:#fff3cd;
                                         color:#856404;
                                         border:1px solid #ffc107;">
                                ⚙️ WORKING
                            </span>
                            <span th:if="${sn == 'RELEASED'}"
                                  style="display:inline-block;
                                         padding:.25rem .6rem;
                                         border-radius:4px;
                                         font-size:.8rem;
                                         font-weight:600;
                                         background:#d4edda;
                                         color:#155724;
                                         border:1px solid #28a745;">
                                ✅ RELEASED
                            </span>
                            <span th:if="${sn == 'OBSOLETE'}"
                                  style="display:inline-block;
                                         padding:.25rem .6rem;
                                         border-radius:4px;
                                         font-size:.8rem;
                                         font-weight:600;
                                         background:#f8d7da;
                                         color:#721c24;
                                         border:1px solid #f5c6cb;">
                                🔒 OBSOLETE
                            </span>
                            <span th:if="${sn == 'KEINE_REVISION'}"
                                  style="display:inline-block;
                                         padding:.25rem .6rem;
                                         border-radius:4px;
                                         font-size:.8rem;
                                         background:#f8f9fa;
                                         color:#6c757d;
                                         border:1px solid #dee2e6;">
                                — Keine Revision
                            </span>
                        </th:block>
                    </td>

                    <!-- Knoten -->
                    <td style="padding:.75rem; text-align:center;
                               font-weight:600;"
                        th:text="${#lists.size(pbop.nodes)}">
                    </td>

                    <!-- Erstellt von -->
                    <td style="padding:.75rem; font-size:.85rem;"
                        th:text="${pbop.createdBy ?: '—'}">
                    </td>

                    <!-- Erstellt am -->
                    <td style="padding:.75rem; font-size:.85rem;
                               color:#6c757d;"
                        th:text="${pbop.createdDate != null
                            ? #temporals.format(pbop.createdDate,
                                'dd.MM.yyyy')
                            : '—'}">
                    </td>

                    <!-- Aktionen -->
                    <td style="padding:.75rem;">
                        <div style="display:flex; gap:.35rem;
                                    align-items:center;
                                    flex-wrap:wrap;">

                            <!-- View -->
                            <a th:href="@{/plant-bop/{id}(id=${pbop.id})}"
                               class="btn btn-primary btn-sm"
                               title="Anzeigen">👁️</a>

                            <!-- Line Balancing -->
                            <a th:href="@{/plant-bop/{id}/balancing(id=${pbop.id})}"
                               class="btn btn-primary btn-sm"
                               title="Line Balancing">⚖️</a>

                            <!-- Edit – nur bei WORKING -->
                            <div sec:authorize="hasAuthority('WRITE')">
                                <a th:if="${pbop.latestStatusName == 'WORKING'}"
                                   th:href="@{/plant-bop/{id}/edit(id=${pbop.id})}"
                                   class="btn btn-primary btn-sm"
                                   title="Bearbeiten"
                                   style="background:#ffc107;
                                          color:#212529;
                                          border-color:#ffc107;">
                                    ✏️
                                </a>
                            </div>

                            <!-- Delete -->
                            <div sec:authorize="hasAuthority('DELETE')">

                                <!-- Löschen erlaubt:
                                     WORKING + keine Knoten -->
                                <form th:if="${pbop.latestStatusName == 'WORKING'
                                              and #lists.isEmpty(pbop.nodes)}"
                                      th:action="@{/plant-bop/{id}/delete(id=${pbop.id})}"
                                      method="post"
                                      onsubmit="return confirm(
                                          'Plant BOP \''
                                          + /*[[${pbop.name}]]*/ ''
                                          + '\' wirklich löschen?');">
                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}"/>
                                    <button type="submit"
                                            class="btn btn-danger btn-sm"
                                            title="Löschen">
                                        🗑️
                                    </button>
                                </form>

                                <!-- Löschen gesperrt – Status -->
                                <button th:if="${pbop.latestStatusName == 'RELEASED'
                                                or pbop.latestStatusName == 'OBSOLETE'}"
                                        type="button" disabled
                                        class="btn btn-sm"
                                        style="background:#e9ecef;
                                               color:#6c757d;
                                               cursor:not-allowed;
                                               border:1px solid #dee2e6;"
                                        title="Löschen nicht möglich: Status ist nicht WORKING">
                                    🔒
                                </button>

                                <!-- Löschen gesperrt – Knoten -->
                                <button th:if="${pbop.latestStatusName == 'WORKING'
                                                and !#lists.isEmpty(pbop.nodes)}"
                                        type="button" disabled
                                        class="btn btn-sm"
                                        style="background:#e9ecef;
                                               color:#6c757d;
                                               cursor:not-allowed;
                                               border:1px solid #dee2e6;"
                                        th:title="${'Löschen nicht möglich: '
                                            + #lists.size(pbop.nodes)
                                            + ' Knoten vorhanden'}">
                                    🔒
                                </button>
                            </div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <div style="margin-top:1rem; font-size:.85rem;
                    color:#6c757d;">
            Gesamt:
            <strong th:text="${#lists.size(plantBOPs)}">0</strong>
            Einträge
        </div>
    </div>
</div>
</body>
</html>
