<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Drawing - PEB</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
	<meta name="_csrf" th:content="${_csrf.token}"/>
<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
    <div class="header">
        <div class="logo-placeholder">PEB</div>
        <h1>Edit Drawing</h1>
        <div style="margin-left: auto;">
            <a th:href="@{/drawings/{id}(id=${drawingId})}" class="btn btn-primary">Back to Drawing</a>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2>Edit Drawing Information</h2>

            <form th:action="@{/drawings/{id}(id=${drawingId})}" th:object="${drawing}" method="post">
                <div class="form-group">
                    <label for="name">Drawing Name *</label>
                    <input type="text" id="name" th:field="*{name}" required maxlength="256">
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" th:field="*{department}" maxlength="128">
                </div>

                <div style="margin-top: 2rem;">
                    <button type="submit" class="btn btn-success">Save Changes</button>
                    <a th:href="@{/drawings/{id}(id=${drawingId})}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <style>
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
    </style>
</body>
</html>
