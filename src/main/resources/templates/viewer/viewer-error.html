<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Viewer - Fehler - PEB</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="header">
    <div class="logo-placeholder">PEB</div>
    <h1>3D Viewer</h1>
    <div style="margin-left:auto;">
        <button onclick="history.back()" class="btn btn-primary">← Zurück</button>
    </div>
</div>
<div class="container">
    <div class="card" style="text-align:center; padding:3rem;">
        <div style="font-size:4rem;">⚠️</div>
        <h2>Viewer nicht verfügbar</h2>
        <p th:text="${error}">Fehler</p>
        <p>Objekt-ID: <strong th:text="${objectId}">—</strong></p>
        <button onclick="history.back()" class="btn btn-primary">Zurück</button>
    </div>
</div>
</body>
</html>
