<!-- fragments/navbar-search.html
     Einbinden in die bestehende Navbar-Vorlage mit:
     <div th:replace="~{fragments/navbar-search :: navbar-search}"></div>
-->
<div th:fragment="navbar-search" class="peb-search" style="position:relative; flex:0 1 320px; min-width:120px;" xmlns:th="http://www.thymeleaf.org">
    <form th:action="@{/search}" method="get" autocomplete="off" style="min-width:0;">
        <input type="text"
               id="peb-search-input"
               name="q"
               th:placeholder="#{search.placeholder}"
               placeholder="Suche nach Name, ID, Material... (auch mit * und ?)"
               style="width:100%; max-width:320px; min-width:120px; box-sizing:border-box;"/>
    </form>

    <div id="peb-search-suggestions"
         style="display:none; position:absolute; top:100%; left:0; width:320px; max-width:100%;
                background:#fff; border:1px solid #ccc; z-index:1000; max-height:400px; overflow-y:auto;">
    </div>


	<button type="button" id="pepperoni-chat-toggle" class="a-button a-button--neutral-primary chat-toggle-fab">
		<i class="a-icon a-button__icon boschicon-bosch-ic-chat"></i>
		<span class="a-button__label">SEPChat</span>
	</button>



    <div id="pepperoni-chat-panel"
         style="display:none; position:fixed; right:20px; bottom:74px; width:360px; max-width:calc(100vw - 24px);
                background:#fff; border:1px solid #d0d7de; border-radius:12px; box-shadow:0 14px 36px rgba(15,23,42,.22);
                z-index:1200; overflow:hidden;">
        <div class="pepperoni-chat-title" style="padding:10px 12px; color:#fff; font-weight:700;">
            <span th:text="#{chat.title}">PEPperoni</span>
        </div>
        <div id="pepperoni-chat-log" style="max-height:280px; overflow:auto; padding:12px; font-size:14px;"></div>
        <div style="display:flex; gap:8px; padding:10px; border-top:1px solid #e5e7eb;">
            <input id="pepperoni-chat-input"
                   type="text"
                   th:placeholder="#{chat.placeholder}"
                   placeholder="Frage nach Name, ID oder Objekt..."
                   style="flex:1; border:1px solid #cbd5e1; border-radius:8px; padding:8px 10px;"/>
                <button id="pepperoni-chat-send"
                    class="a-button a-button--brand-primary"
                    type="button"
                    th:text="#{chat.send}"
                    style="border:none; border-radius:8px; padding:8px 12px; cursor:pointer;">
                Senden
            </button>
        </div>
    </div>

    <script th:inline="javascript">
    (function () {
        const input = document.getElementById('peb-search-input');
        const dropdown = document.getElementById('peb-search-suggestions');
        let debounceTimer = null;
        let currentAbortController = null;
        const viewAllResultsText = /*[[#{search.viewAllResults}]]*/ 'Alle Ergebnisse anzeigen →';

        function renderSuggestions(items, query) {
            dropdown.innerHTML = '';

            if (items.length === 0) {
                dropdown.style.display = 'none';
                return;
            }

            items.forEach(item => {
                const row = document.createElement('a');
                row.href = item.detailUrl;
                row.style.cssText = 'display:block; padding:8px 12px; text-decoration:none; color:#333; border-bottom:1px solid #eee;';
                row.innerHTML =
                    '<strong>' + escapeHtml(item.name) + '</strong>' +
                    ' <span style="color:#888; font-size:0.85em;">(' + escapeHtml(item.objectTypeDisplayName) +
                    ' · ' + escapeHtml(item.objectId) + ' · Rev. ' + escapeHtml(item.revision) + ')</span>';
                dropdown.appendChild(row);
            });

            const allResultsLink = document.createElement('a');
            allResultsLink.href = '/search?q=' + encodeURIComponent(query);
            allResultsLink.style.cssText = 'display:block; padding:8px 12px; text-decoration:none; color:#0066cc; font-weight:bold;';
            allResultsLink.textContent = viewAllResultsText;
            dropdown.appendChild(allResultsLink);

            dropdown.style.display = 'block';
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        input.addEventListener('input', function () {
            const query = input.value.trim();
            clearTimeout(debounceTimer);

            if (query.length < 2) {
                dropdown.style.display = 'none';
                return;
            }

            // Vorherigen, noch laufenden Request abbrechen (Race-Condition
            // vermeiden: schneller Tipper könnte sonst ein altes,
            // langsameres Ergebnis nach dem neuen anzeigen)
            debounceTimer = setTimeout(function () {
                if (currentAbortController) {
                    currentAbortController.abort();
                }
                currentAbortController = new AbortController();

                fetch('/api/search/suggest?q=' + encodeURIComponent(query), {
                    signal: currentAbortController.signal
                })
                    .then(res => {
                        if (!res.ok) {
                            // Sollte dank Fehlerbehandlung in SearchService eigentlich
                            // nie mehr auftreten - Sicherheitsnetz für den Fall, dass
                            // doch mal ein anderer Fehler durchschlägt.
                            throw new Error('Suggest-Request fehlgeschlagen: HTTP ' + res.status);
                        }
                        return res.json();
                    })
                    .then(items => renderSuggestions(items, query))
                    .catch(err => {
                        if (err.name !== 'AbortError') {
                            console.error('Search suggest failed', err);
                        }
                    });
            }, 200); // 200ms Debounce, um nicht bei jedem Tastendruck zu feuern
        });

        document.addEventListener('click', function (event) {
            if (!event.target.closest('.peb-search')) {
                dropdown.style.display = 'none';
            }
        });
    })();
    </script>

    <script th:inline="javascript">
    (function () {
        const toggle = document.getElementById('pepperoni-chat-toggle');
        const panel = document.getElementById('pepperoni-chat-panel');
        const input = document.getElementById('pepperoni-chat-input');
        const send = document.getElementById('pepperoni-chat-send');
        const log = document.getElementById('pepperoni-chat-log');
        const botName = 'SEPChat';
        const welcomeText = /*[[#{chat.welcome}]]*/ 'Hallo, ich bin SEPChat. Frag mich nach Namen, IDs oder Objekttypen.';

        if (!toggle || !panel || !input || !send || !log) {
            return;
        }

        function appendMessage(sender, text, isHtml) {
            const item = document.createElement('div');
            item.style.cssText = 'margin-bottom:10px; line-height:1.45;';
            const prefix = '<strong>' + sender + ':</strong> ';
            if (isHtml) {
                item.innerHTML = prefix + text;
            } else {
                item.textContent = sender + ': ' + text;
            }
            log.appendChild(item);
            log.scrollTop = log.scrollHeight;
        }

        function renderResults(data) {
            if (!data.results || data.results.length === 0) {
                return;
            }

            const links = data.results.map(function (r) {
                const label = [r.objectTypeDisplayName, r.objectId, r.name, 'Rev. ' + (r.revision || '-')].join(' · ');
                return '<a href="' + (r.detailUrl || '#') + '" style="display:block; margin:4px 0; color:#0f766e; text-decoration:none;">' + escapeHtml(label) + '</a>';
            }).join('');

            appendMessage(botName, links, true);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function sendQuery() {
            const q = input.value.trim();
            if (!q) {
                return;
            }

            appendMessage('Du', q, false);
            input.value = '';

            fetch('/api/chat/query?q=' + encodeURIComponent(q))
                .then(function (res) {
                    if (!res.ok) {
                        throw new Error('HTTP ' + res.status);
                    }
                    return res.json();
                })
                .then(function (data) {
                    appendMessage(data.botName || botName, data.responseText || '', false);
                    renderResults(data);
                })
                .catch(function () {
                    appendMessage(botName, 'Die Anfrage konnte nicht verarbeitet werden.', false);
                });
        }

        toggle.addEventListener('click', function () {
            const isVisible = panel.style.display === 'block';
            panel.style.display = isVisible ? 'none' : 'block';
            if (!isVisible) {
                input.focus();
                if (!log.dataset.initialized) {
                    appendMessage(botName, welcomeText, false);
                    log.dataset.initialized = 'true';
                }
            }
        });

        send.addEventListener('click', sendQuery);
        input.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendQuery();
            }
        });
    })();
    </script>
</div>
