<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PEB</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
	<meta name="_csrf" th:content="${_csrf.token}"/>
<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo-placeholder">PEB</div>
            <h2>Production Engineering Backbone</h2>
        </div>

        <div th:if="${param.error}" class="alert alert-danger">
            Invalid username or password.
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            You have been logged out successfully.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="demo-credentials">
            <h4>Demo Credentials:</h4>
            <ul>
                <li><strong>Admin:</strong> admin / admin123 (Full access)</li>
                <li><strong>User:</strong> user / user123 (Read & Write)</li>
                <li><strong>Viewer:</strong> viewer / viewer123 (Read only)</li>
            </ul>
        </div>
    </div>
</body>
</html>
