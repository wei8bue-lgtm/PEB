<!-- src/main/resources/templates/login.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title}">Login - PEB</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <!--
        ENTFERNT: CSRF Meta-Tags
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
        Nicht mehr nötig - Thymeleaf th:action fügt den
        CSRF Hidden-Field automatisch ein.
    -->
</head>
<body>
<div class="login-container">

    <div class="login-header">
        <div class="logo-placeholder">PEB</div>
        <h2 th:text="#{login.heading}">Production Engineering Backbone</h2>
        <p class="login-subtitle" th:text="#{login.subtitle}">
            Bitte melden Sie sich mit Ihren AD-Zugangsdaten an
        </p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        <strong th:text="#{login.failed}">Anmeldung fehlgeschlagen.</strong><br>
        <span th:if="${session['SPRING_SECURITY_LAST_EXCEPTION'] != null}"
              th:text="${session['SPRING_SECURITY_LAST_EXCEPTION'].message}">
        </span>
        <span th:unless="${session['SPRING_SECURITY_LAST_EXCEPTION'] != null}" th:text="#{login.checkCredentials}">
            Bitte prüfen Sie Ihre Zugangsdaten.
        </span>
    </div>

    <div th:if="${param.logout}" class="alert alert-success" th:text="#{login.logoutSuccess}">
        Sie wurden erfolgreich abgemeldet.
    </div>

    <!--
        th:action ist PFLICHT (nicht action="..."):
        Thymeleaf fügt automatisch ein Hidden-Field ein:
        <input type="hidden" name="_csrf" value="abc123...">
    -->
    <form th:action="@{/login}" method="post">

        <div class="form-group">
            <label for="username">
                <span th:text="#{login.username}">AD-Benutzername</span>
                <span class="label-hint" th:text="#{login.usernameHint}">(z.B. AB1CDE)</span>
            </label>
            <input type="text"
                   id="username"
                   name="username"
                   autocomplete="username"
                   required
                   autofocus
                   th:placeholder="#{login.usernamePlaceholder}"
                   placeholder="Windows-Benutzername">
        </div>

        <div class="form-group">
            <label for="password" th:text="#{login.password}">Passwort</label>
            <input type="password"
                   id="password"
                   name="password"
                   autocomplete="current-password"
                   required
                   th:placeholder="#{login.passwordPlaceholder}"
                   placeholder="Windows-Passwort">
        </div>

        <button type="submit" class="btn-login" th:text="#{login.submit}">Anmelden</button>

    </form>

    <div class="sso-info">
        <p>
            🔐 <strong th:text="#{login.ssoTitle}">Single Sign-On aktiv</strong> –
            <span th:text="#{login.ssoInfo}">Verwenden Sie Ihre Windows-Zugangsdaten.</span><br>
            <span th:text="#{login.ssoProblems}">Bei Problemen:</span>
            <a href="mailto:it-support@de.bosch.com" th:text="#{login.ssoSupport}">IT-Support</a>
        </p>
    </div>

</div>
</body>
</html>
