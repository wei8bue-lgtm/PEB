<!-- src/main/resources/templates/login.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title}">Login - SEP4Eng</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" th:href="@{css/brand/styles/frontend-kit-complete.css}">
	<link rel="stylesheet" th:href="@{css/brand/styles/brands/bosch/styles/semantic/index.css}">
</head>
<body>
<div class="login-card frontend-kit__example-wrapper -primary">

	<div
	  class="a-sticker -emphasis-01"
	  aria-labelledby="sticker-label-id-emphasis-01">
	  <span id="sticker-label-id-emphasis-01" class="a-sticker__label -size-l">
		SEP4Eng
	  </span>
	</div>
        <h3 th:text="#{login.heading}">Synchronous Engineering Platform</h3>
        <p class="login-subtitle" th:text="#{login.subtitle}">
            Please sign in with your AD credentials
        </p>

	<div th:if="${param.error}" class="a-notification -error" role="alert">
	  <i class="a-icon ui-ic-alert-error"></i>
	  <div
		id="notification-label-id-bar-error-error"
		class="a-notification__content"
		th:text="#{login.checkCredentials}"> Please check your credentials.
	  </div>
	</div>
	
	<div th:if="${param.logout}" class="a-notification -success" role="alert">
		<i class="a-icon ui-ic-alert-success"></i>
		<div
			id="notification-label-id-bar-success-success"
			class="a-notification__content"
			th:text="#{login.logoutSuccess}">You have been successfully logged out>
		</div>
	</div>

    <form th:action="@{/login}" method="post">
		
		<div class="a-text-field">
					 <input type="text"
                   id="username"
                   name="username"
                   autocomplete="username"
                   required
                   autofocus
                   th:placeholder="#{login.usernamePlaceholder}"
                   placeholder="Windows-Benutzername">
		</div>
	
		<div class="a-password-input">
		    <label for="password" th:text="#{login.password}">Passwort</label>
			<input type="password"
                   id="password"
                   name="password"
                   autocomplete="current-password"
                   required
                   th:placeholder="#{login.passwordPlaceholder}"
                   placeholder="Windows-Passwort">
		  <button
			type="button"
			class="a-password-input__icon-password"
			aria-label="Show password">
			<i class="a-icon ui-ic-watch-on"></i>
		  </button>
		</div>

		<button type="submit" class="a-button a-button--primary">
			<span class="a-button__label" th:text="#{login.submit}">Login</span>
		</button>		

    </form>


	<div class="a-text-area">
		<textarea id="1" disabled="" th:text="|#{login.ssoTitle} – #{login.ssoInfo}&#10;#{login.ssoProblems} mailto:it-support@de.bosch.com|">
		</textarea>
	</div>



</div>

<script>
(function () {
    const toggleBtn = document.querySelector('.a-password-input__icon-password');
    const passwordInput = document.getElementById('password');
    if (!toggleBtn || !passwordInput) {
        return;
    }
    const icon = toggleBtn.querySelector('i.a-icon');

    toggleBtn.addEventListener('click', function () {
        const isHidden = passwordInput.type === 'password';
        passwordInput.type = isHidden ? 'text' : 'password';
        toggleBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
        if (icon) {
            icon.classList.toggle('ui-ic-watch-on', !isHidden);
            icon.classList.toggle('ui-ic-watch-off', isHidden);
        }
    });
})();
</script>
</body>
</html>
