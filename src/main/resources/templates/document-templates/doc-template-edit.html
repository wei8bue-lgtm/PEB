<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="#{docTemplate.editTitle}">Template bearbeiten - PEB</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/brand/styles/frontend-kit-complete.css}">
    <link rel="stylesheet" th:href="@{/css/brand/styles/brands/bosch/styles/semantic/index.css}">
    <style>.app-layout{display:flex;align-items:flex-start}.app-layout__content{flex:1 1 auto;min-width:0}.card form .form-group{margin-bottom:1.25rem}.a-text-area{margin-top:1.5rem}.a-text-area label{position:static!important;display:block;margin-bottom:.35rem}.a-text-area textarea{pointer-events:auto!important;overflow-y:auto!important;width:100%;box-sizing:border-box;resize:vertical}</style>
</head>
<body>
    <div th:replace="~{fragments/header :: header(#{docTemplate.heading})}"></div>

    <div class="app-layout"><div th:replace="~{fragments/side-navigation :: side-navigation}"></div><div class="app-layout__content"><div class="frontend-kit__example-wrapper -secondary"><div class="e-container" style="margin:1rem auto;"><div class="frontend-kit__example-wrapper -primary"><div class="container">
        <div class="card">
            <h2>
                <span th:text="#{docTemplate.editHeadingShort}">Template bearbeiten</span>
                <span style="font-size:.9rem; color:#6c757d; font-weight:400; margin-left:.5rem;"
                      th:text="${templateId}"></span>
            </h2>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/document-templates/{id}(id=${templateId})}"
                  th:object="${template}" method="post">

                <div class="form-group a-text-field">
                    <label for="name" th:text="#{label.name} + ' *'">Name *</label>
                    <input type="text" id="name" th:field="*{name}"
                           required maxlength="255">
                </div>

                <div class="form-group a-text-field">
                    <label for="department" th:text="#{label.department}">Department</label>
                    <input type="text" id="department" th:field="*{department}"
                           maxlength="100">
                </div>

                <div class="a-text-area">
                    <label for="description" th:text="#{label.description}">Beschreibung</label>
                    <textarea id="description" th:field="*{description}"
                              maxlength="1000" rows="3"></textarea>
                </div>

                <hr style="margin:1.5rem 0;">
                <h3 th:text="#{docTemplate.attributesHeading}">Attribute</h3>
                <p class="help-text" th:text="#{docTemplate.attributesHelpEdit}">
                    Diese Werte beschreiben die Bedeutung der Platzhalter
                    {{Attribute1}} und {{Attribute2}}.
                    Beim Erstellen eines Dokuments werden sie als Hinweis angezeigt.
                </p>

                <div class="form-group a-text-field">
                    <label for="attribute1" th:text="#{label.attribute1}">Attribute 1</label>
                    <input type="text" id="attribute1" th:field="*{attribute1}"
                           maxlength="500">
                </div>

                <div class="form-group a-text-field">
                    <label for="attribute2" th:text="#{label.attribute2}">Attribute 2</label>
                    <input type="text" id="attribute2" th:field="*{attribute2}"
                           maxlength="500">
                </div>

                <div style="margin-top:2rem;">
                          <button type="submit" class="a-button a-button--primary"><i class="a-icon a-button__icon boschicon-bosch-ic-save"></i><span class="a-button__label" th:text="#{button.saveChanges}">Änderungen speichern</span></button>
                          <button type="button" class="a-button a-button--destructive-primary" th:onclick="|window.location.href='@{/document-templates/{id}(id=${templateId})}'|"><i class="a-icon a-button__icon boschicon-bosch-ic-reset"></i><span class="a-button__label" th:text="#{button.cancel}">Abbrechen</span></button>
                </div>
            </form>
        </div>

<!--         <div class="card">
            <h3 th:text="#{docTemplate.notesHeading}">Hinweise</h3>
            <div class="a-text-area">
                <textarea id="templateEditNotes" readonly tabindex="0"
                          th:text="|#{docTemplate.editNote1}\n#{docTemplate.editNote2}\n#{docTemplate.editNote3}|">Die Stammdaten können jederzeit bearbeitet werden.</textarea>
            </div>
        </div> -->
		
		<div class="a-text-area">
			<textarea id="1" readonly tabindex="0" th:text="|#{docTemplate.notesHeading}&#10;#{docTemplate.editNote1}&#10;#{docTemplate.editNote2}&#10;#{docTemplate.editNote3}|">
			</textarea>
		</div>
    </div>
    </div></div></div></div></div><div th:replace="~{fragments/footer :: footer}"></div></div></div>

    <style>
        .btn-secondary { background:#6c757d; color:white; }
        .btn-secondary:hover { background:#5a6268; }
        .alert-danger { background:#f8d7da; color:#721c24; border:1px solid #f5c6cb; padding:1rem; border-radius:4px; margin-bottom:1rem; }
        .help-text { color:#6c757d; font-size:.9rem; margin-bottom:.75rem; }
        textarea { width:100%; box-sizing:border-box; padding:.5rem; border:1px solid #ced4da; border-radius:4px; font-family:inherit; }
        code { background:#f8f9fa; padding:.1rem .3rem; border-radius:3px; font-size:.9rem; color:#c7254e; }
    </style>
</body>
</html>
