<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.title}">SEP4Eng - Synchronous Engineering Platform</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{css/brand/styles/frontend-kit-complete.css}">
    <link rel="stylesheet" th:href="@{css/brand/styles/brands/bosch/styles/semantic/index.css}">
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <style>
        /* einfaches Layout: Side-Navigation links, Inhalt rechts */
        .app-layout {
            display: flex;
            align-items: flex-start;
        }
        .app-layout__content {
            flex: 1 1 auto;
            min-width: 0;
        }
    </style>
</head>
<body>

    <!-- ── Header (Fragment) ─────────────────────────────────── -->
    <div th:replace="~{fragments/header :: header(#{docTemplate.heading})}"></div>

    <div class="app-layout">

        <!-- ── Side-Navigation (Fragment) ────────────────────── -->
        <div th:replace="~{fragments/side-navigation :: side-navigation}"></div>

        <div class="app-layout__content">

            <div class="frontend-kit__example-wrapper -secondary">
                <div class="e-container" style="margin: 1rem auto;">
                    <div class="frontend-kit__example-wrapper -primary">
            <div class="container">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h3 style="margin:0">
                            <span th:text="#{docTemplate.allTemplates}">Alle Document Templates</span>
                            (<span th:text="${templates.size()}">0</span>)
                        </h3>
                        <div style="display:flex; gap:.5rem; align-items:center;">
                            <div th:if="${param.deleted}" class="alert alert-success" style="margin:0; padding:.4rem .8rem;" th:text="#{docTemplate.deletedAlert}">
                                ✅ Template gelöscht.
                            </div>
                            <sec:authorize access="hasAuthority('WRITE')">
                                <button type="button" class="a-button a-button--primary" th:onclick="|window.location.href='@{/document-templates/new}'|">
                                    <i class="a-icon a-button__icon boschicon-bosch-ic-add"></i>
                                    <span class="a-button__label" th:text="#{button.newTemplate}">+ Neues Template</span>
                                </button>
                            </sec:authorize>
                        </div>
                    </div>

                    <form method="get" style="display:flex; gap:.5rem; margin-bottom:1rem;">
                        <div class="a-text-field">
                            <input type="text"
                                   name="search"
                                   th:value="${search}"
                                   th:placeholder="#{docTemplate.searchPlaceholder}"
                                   placeholder="Search name / ID / department / attributes...">
                        </div>
                        <button type="submit" class="a-button a-button--primary">
                            <i class="a-icon a-button__icon boschicon-bosch-ic-search"></i>
                            <span class="a-button__label" th:text="#{button.searchPlain}">Search</span>
                        </button>
                        <button type="button" class="a-button a-button--primary" th:onclick="|window.location.href='@{/document-templates}'|">
                            <i class="a-icon a-button__icon boschicon-bosch-ic-reset"></i>
                            <span class="a-button__label" th:text="#{button.reset}">Reset</span>
                        </button>
                    </form>

                    <table class="m-table" aria-label="Document Templates">
                        <thead>
                            <tr>
                                <th th:text="#{label.id}">ID</th>
                                <th th:text="#{label.name}">Name</th>
                                <th th:text="#{label.department}">Department</th>
                                <th th:text="#{label.attribute1}">Attribute 1</th>
                                <th th:text="#{label.attribute2}">Attribute 2</th>
                                <th th:text="#{label.currentStatus}">Aktueller Status</th>
                                <th style="text-align: right;" th:text="#{label.actions}">Aktionen</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="tmpl : ${templates}">
                                <td th:text="${tmpl.id}">DT00000001</td>
                                <td>
                                    <a th:href="@{'/document-templates/' + ${tmpl.id}}" th:text="${tmpl.name}">Template Name</a>
                                </td>
                                <td th:text="${tmpl.department}">Engineering</td>
                                <td th:text="${tmpl.attribute1}"></td>
                                <td th:text="${tmpl.attribute2}"></td>
                                <td class="-with-icon-and-label" th:if="${tmpl.latestRevision != null}">
                                    <i th:if="${tmpl.latestRevision.releaseStatus.name() == 'WORKING'}" class="a-icon boschicon-bosch-ic-settings"></i>
                                    <i th:if="${tmpl.latestRevision.releaseStatus.name() == 'RELEASED'}" class="a-icon boschicon-bosch-ic-checkmark"></i>
                                    <i th:if="${tmpl.latestRevision.releaseStatus.name() == 'OBSOLETE'}" class="a-icon boschicon-bosch-ic-shield-stop"></i>
                                    <span th:text="${tmpl.latestRevision.releaseStatus.displayName}"></span>
                                </td>
                                <td th:if="${tmpl.latestRevision == null}">-</td>
                                <td style="text-align: right;">
                                    <div style="display: inline-flex; gap: 0.5rem; justify-content: flex-end; align-items: center;">
                                        <div class="a-link -icon">
                                            <a th:href="@{'/document-templates/' + ${tmpl.id}}" target="_self">
                                                <span></span>
                                                <span>[[#{button.details}]]</span>
                                            </a>
                                        </div>
                                        <div class="a-link -icon" sec:authorize="hasAuthority('WRITE')">
                                            <a th:href="@{'/document-templates/' + ${tmpl.id} + '/edit'}" target="_self">
                                                <span></span>
                                                <span>[[#{button.edit}]]</span>
                                            </a>
                                        </div>
                                        <form th:action="@{/document-templates/{id}/delete(id=${tmpl.id})}"
                                              method="post" style="display:inline;"
                                              sec:authorize="hasAuthority('DELETE')"
                                              th:attr="onsubmit=|return confirm('${#strings.escapeJavaScript(#messages.msg('docTemplate.confirmDelete', tmpl.id))}');|">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="a-button a-button--integrated" title="Delete">
                                                <i class="a-icon boschicon-bosch-ic-delete"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${templates.isEmpty()}">
                                <td colspan="7" style="text-align:center; color:#888;" th:text="#{docTemplate.noneFound}">
                                    Keine Templates vorhanden. Erstellen Sie das erste Document Template!
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
                    </div>
                </div>
            </div>

            <!-- ── Footer (Fragment) ─────────────────────────── -->
            <div th:replace="~{fragments/footer :: footer}"></div>

        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
