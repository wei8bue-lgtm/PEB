<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? #{pBom.editTitle} : #{pBom.newTitle}">
        Product BOM – PEB
    </title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="header">
    <div class="logo-placeholder">SEP</div>
    <h1 th:text="${isEdit} ? #{pBom.editHeading} : #{pBom.newHeading}">
        Product BOM
    </h1>
    <div style="margin-left:auto;">
        <a th:href="${isEdit}
                    ? @{/product-bom/{id}(id=${bom.id})}
                    : @{/product-bom}"
           class="btn btn-primary">← <span th:text="#{button.back}">Zurück</span></a>
    </div>
</div>

<div class="container">
    <div class="card" style="max-width:700px;">

        <!-- Info-Banner im Edit-Modus -->
        <div th:if="${isEdit}"
             style="background:#e7f3ff;border-left:4px solid
                    #0056b3;padding:.75rem 1rem;
                    border-radius:4px;margin-bottom:1.5rem;
                    font-size:.9rem;">
            <strong>✏️ <span th:text="#{mfgBom.editModeLabel}">Bearbeitungsmodus</span></strong> –
            <span th:text="#{pBom.idLabel}">Product BOM ID:</span>
            <code th:text="${bom.id}"></code>
            &nbsp;|&nbsp; <span th:text="#{label.createdDate} + ':'">Erstellt am:</span>
            <span th:text="${bom.createdDate != null
                ? #temporals.format(bom.createdDate,
                    'dd.MM.yyyy')
                : '—'}">
            </span>
        </div>

        <!-- Fehlerhinweis -->
        <div th:if="${errorMessage}"
             style="background:#f8d7da;border-left:4px solid
                    #dc3545;padding:.75rem 1rem;
                    border-radius:4px;margin-bottom:1rem;
                    color:#721c24;"
             th:text="${errorMessage}">
        </div>

        <!-- Formular:
             /new     → Erstellen
             /{id}/edit → Aktualisieren -->
        <form th:action="${isEdit}
                          ? @{/product-bom/{id}/edit(
                              id=${bom.id})}
                          : @{/product-bom/new}"
              method="post">

            <!-- Name -->
            <div class="form-group">
                <label th:text="#{label.name} + ' *'">Name *</label>
                <input type="text"
                       name="name"
                       th:value="${bom.name}"
                       required
                       placeholder="z.B. BOM – Akku-Bohrmaschine XR-20">
            </div>

            <!-- Version -->
            <div class="form-group">
                <label th:text="#{label.version}">Version</label>
                <input type="text"
                       name="bomVersion"
                       th:value="${bom.bomVersion ?: '01'}"
                       placeholder="01">
            </div>

            <!-- Beschreibung -->
            <div class="form-group">
                <label th:text="#{label.description}">Beschreibung</label>
                <textarea name="description"
                          rows="3"
                          placeholder="Kurze Beschreibung…"
                          style="width:100%;padding:.5rem;
                                 border:1px solid #ddd;
                                 border-radius:4px;
                                 font-family:inherit;
                                 resize:vertical;"
                          th:text="${bom.description}">
                </textarea>
            </div>

            <!-- ProductData – nur bei Neu-Erstellung anzeigen.
                 Im Edit-Modus über Detail-Seite zuweisen. -->
            <div class="form-group"
                 th:unless="${isEdit}">
                <label>
                    <span th:text="#{label.assignProductData}">ProductData zuweisen</span>
                    <span style="color:#6c757d;font-weight:400;" th:text="#{pBom.cardinalityHint}">
                        (Kardinalität 1:1 – optional)
                    </span>
                </label>
                <select name="productDataId"
                        style="width:100%;padding:.5rem;
                               border:1px solid #ddd;
                               border-radius:4px;">
                    <option value="" th:text="#{option.noneAssignableLater}">
                        — Keine (später zuweisbar) —
                    </option>
                    <option th:each="pd : ${availableProductData}"
                            th:value="${pd.id}"
                            th:text="${pd.id
                                      + ' – '
                                      + pd.name
                                      + (pd.productType != null
                                         ? ' ('
                                           + pd.productType
                                           + ')'
                                         : '')}">
                    </option>
                </select>
                <small style="color:#6c757d;font-size:.82rem;" th:text="#{pBom.onlyUnassignedProductData}">
                    Es werden nur ProductData ohne bestehende
                    BOM angezeigt.
                </small>
            </div>

            <!-- Hinweis im Edit-Modus -->
            <div th:if="${isEdit}"
                 style="background:#fff3cd;border-left:4px solid
                        #ffc107;padding:.75rem 1rem;
                        border-radius:4px;margin-bottom:1rem;
                        font-size:.85rem;color:#856404;">
                💡 <span th:text="#{pBom.editHintLead}">ProductData kann auf der</span>
                <a th:href="@{/product-bom/{id}(id=${bom.id})}"
                   style="color:#856404;font-weight:600;" th:text="#{label.detailPage}">
                    Detail-Seite
                </a>
                <span th:text="#{pBom.editHintTrail}">zugewiesen oder geändert werden.</span>
            </div>

            <!-- Buttons -->
            <div style="display:flex;gap:.5rem;
                        margin-top:1.5rem;">
                <button type="submit"
                        class="btn btn-primary">
                    <span th:text="${isEdit} ? #{button.saveChangesIcon} : #{button.saveIcon}">
                    </span>
                </button>
                <a th:href="${isEdit}
                             ? @{/product-bom/{id}(
                                 id=${bom.id})}
                             : @{/product-bom}"
                   class="btn btn-primary"
                   style="background:#6c757d;" th:text="#{button.cancelX}">
                    ✖ Abbrechen
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
