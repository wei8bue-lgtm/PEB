<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.title}">SEP4Eng - Synchronous Engineering Platform</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{css/brand/styles/frontend-kit-complete.css}">
    <link rel="stylesheet" th:href="@{css/brand/styles/brands/bosch/styles/semantic/index.css}">
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <style>
        .app-layout {
            display: flex;
            align-items: flex-start;
        }
        .app-layout__content {
            flex: 1 1 auto;
            min-width: 0;
        }
    </style>
</head>
<body>

    <!-- ── Header (Fragment) ─────────────────────────────────── -->
    <div th:replace="~{fragments/header :: header(#{pBom.heading})}"></div>

    <div class="app-layout">

        <!-- ── Side-Navigation (Fragment) ────────────────────── -->
        <div th:replace="~{fragments/side-navigation :: side-navigation}"></div>

        <div class="app-layout__content">

            <div class="container">
                <!-- Alerts -->
                <div th:if="${successMessage}" class="alert alert-success" style="margin-bottom:1rem;" th:text="${successMessage}">Success</div>
                <div th:if="${errorMessage}" class="alert alert-danger" style="margin-bottom:1rem;" th:text="${errorMessage}">Error</div>

                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                        <h3 style="margin:0;" th:text="#{pBom.listHeading}">Product BOM Liste</h3>
                        <sec:authorize access="hasAuthority('WRITE')">
                            <button type="button" class="a-button a-button--primary" th:onclick="|window.location.href='@{/product-bom/new}'|">
                                <i class="a-icon a-button__icon boschicon-bosch-ic-add"></i>
                                <span class="a-button__label" th:text="#{button.newProductBom}">Neue Product BOM</span>
                            </button>
                        </sec:authorize>
                    </div>

                    <!-- Suche -->
                    <form method="get" style="display:flex; gap:.5rem; margin-bottom:1rem;">
                        <div class="a-text-field">
                            <input type="text"
                                   name="search"
                                   th:value="${search}"
                                   th:placeholder="#{mfgBom.searchPlaceholder}"
                                   placeholder="Name suchen…">
                        </div>
                        <button type="submit" class="a-button a-button--primary">
                            <i class="a-icon a-button__icon boschicon-bosch-ic-search"></i>
                            <span class="a-button__label" th:text="#{button.searchPlain}">Suchen</span>
                        </button>
                        <button type="button" class="a-button a-button--primary" th:onclick="|window.location.href='@{/product-bom}'|">
                            <i class="a-icon a-button__icon boschicon-bosch-ic-reset"></i>
                            <span class="a-button__label" th:text="#{button.reset}">Reset</span>
                        </button>
                    </form>

                    <!-- Tabelle -->
                    <table class="m-table" aria-label="Product BOMs">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Version</th>
                                <th>Status</th>
                                <th>ProductData</th>
                                <th>Mfg BOMs</th>
                                <th>Erstellt</th>
                                <th style="text-align: right;">Aktionen</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(bomList)}">
                                <td colspan="8" style="text-align:center; color:#6c757d;" th:text="#{pBom.noneFound}">
                                    Keine Product BOMs vorhanden.
                                </td>
                            </tr>
                            <tr th:each="bom : ${bomList}">
                                <td>
                                    <a th:href="@{'/product-bom/' + ${bom.id}}" th:text="${bom.id}"></a>
                                </td>
                                <td>
                                    <a th:href="@{'/product-bom/' + ${bom.id}}" th:text="${bom.name}"></a>
                                </td>
                                <td>
                                    <span th:text="${bom.bomVersion ?: '01'}">01</span>
                                </td>
                                <td class="-with-icon-and-label" th:with="sn=${bom.latestStatusName}">
                                    <i th:if="${sn == 'WORKING'}" class="a-icon boschicon-bosch-ic-settings"></i>
                                    <i th:if="${sn == 'RELEASED'}" class="a-icon boschicon-bosch-ic-checkmark"></i>
                                    <i th:if="${sn == 'OBSOLETE'}" class="a-icon boschicon-bosch-ic-shield-stop"></i>
                                    <span th:text="${sn == 'KEINE_REVISION' ? #messages.msg('status.noRevision') : sn}"></span>
                                </td>
                                <td>
                                    <a th:if="${bom.productData != null}"
                                       th:href="@{'/product-data/' + ${bom.productData.id}}"
                                       th:text="${bom.productData.id + ' – ' + bom.productData.name}">
                                    </a>
                                    <span th:if="${bom.productData == null}" style="color:#6c757d;" th:text="#{pBom.notAssigned}">
                                        ⚠️ Nicht zugewiesen
                                    </span>
                                </td>
                                <td th:text="${#lists.size(bom.manufacturingBOMs)}">0</td>
                                <td th:text="${bom.createdDate != null ? #temporals.format(bom.createdDate, 'dd.MM.yyyy') : '—'}"></td>
                                <td style="text-align: right;">
                                    <div style="display:inline-flex; gap:0.5rem; justify-content:flex-end; align-items:center;">
                                        <div class="a-link -icon">
                                            <a th:href="@{'/product-bom/' + ${bom.id}}" target="_self">
                                                <span></span>
                                                <span>[[#{button.view}]]<i class="a-icon ui-ic-nosafe-lr-forward-small"></i></span>
                                            </a>
                                        </div>
                                        <div class="a-link -icon" sec:authorize="hasAuthority('WRITE')" th:if="${bom.latestStatusName == 'WORKING'}">
                                            <a th:href="@{'/product-bom/' + ${bom.id} + '/edit'}" target="_self">
                                                <span></span>
                                                <span><i class="a-icon boschicon-bosch-ic-edit"></i> [[#{button.edit}]]</span>
                                            </a>
                                        </div>
                                        <div sec:authorize="hasAuthority('DELETE')">
                                            <form th:if="${bom.latestStatusName == 'WORKING' and bom.productData == null and #lists.isEmpty(bom.manufacturingBOMs)}"
                                                  th:action="@{'/product-bom/' + ${bom.id} + '/delete'}"
                                                  method="post"
                                                  style="display:inline;"
                                                  th:attr="onsubmit=|return confirm('${#strings.escapeJavaScript(#messages.msg('pBom.confirmDeleteFull2', bom.name))}');|">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                <button type="submit" class="a-button a-button--integrated" title="Delete">
                                                    <i class="a-icon boschicon-bosch-ic-delete"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <div style="margin-top:1rem; font-size:.85rem; color:#6c757d;">
                        <span th:text="#{mfgBom.total}">Gesamt:</span>
                        <strong th:text="${#lists.size(bomList)}">0</strong>
                        <span th:text="#{mfgBom.entries}">Einträge</span>
                    </div>
                </div>
            </div>

            <!-- ── Footer (Fragment) ─────────────────────────── -->
            <div th:replace="~{fragments/footer :: footer}"></div>

        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
