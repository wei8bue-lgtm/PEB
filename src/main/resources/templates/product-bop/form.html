<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? #{pBop.editTitle} : #{pBop.newTitle}">
        Product BOP – PEB
    </title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="header">
    <div class="logo-placeholder">SEP</div>
    <h1 th:text="${isEdit} ? #{pBop.editHeading} : #{pBop.newHeading}">
        Product BOP
    </h1>
    <div style="margin-left:auto;">
        <a th:href="${isEdit} ? @{/product-bop/{id}(id=${bop.id})} : @{/product-bop}"
           class="btn btn-primary">← <span th:text="#{button.back}">Zurück</span></a>
    </div>
</div>

<div class="container">
<div class="card" style="max-width:700px;">

    <!-- Info-Banner im Edit-Modus -->
    <div th:if="${isEdit}"
         style="background:#e7f3ff;border-left:4px solid #0056b3;
                padding:.75rem 1rem;border-radius:4px;
                margin-bottom:1.5rem;font-size:.9rem;">
        <strong>✏️ <span th:text="#{mfgBom.editModeLabel}">Bearbeitungsmodus</span></strong> –
        <span th:text="#{pBop.idLabel}">Product BOP ID:</span>
        <code th:text="${bop.id}"></code>
        &nbsp;|&nbsp; <span th:text="#{lifecycle.history.createdBy}">Erstellt von</span>:
        <span th:text="${bop.createdBy ?: '—'}"></span>
    </div>

    <!-- ── Speichern-Formular ──────────────────────────────── -->
    <form th:action="${isEdit} ? @{/product-bop/{id}/edit(id=${bop.id})} : @{/product-bop/new}"
          method="post">

        <!-- Name -->
        <div class="form-group">
            <label th:text="#{label.name} + ' *'">Name *</label>
            <input type="text"
                   name="name"
                   th:value="${bop.name}"
                   required
                   th:placeholder="#{label.namePlaceholderBop}"
                   placeholder="z.B. BOP – Akku-Bohrmaschine Montage">
        </div>

        <!-- Version -->
        <div class="form-group">
            <label th:text="#{label.version}">Version</label>
            <input type="text"
                   name="bopVersion"
                   th:value="${bop.bopVersion ?: '01'}"
                   placeholder="01">
        </div>

        <!-- Beschreibung -->
        <div class="form-group">
            <label th:text="#{label.description}">Beschreibung</label>
            <textarea name="description"
                      rows="3"
                      th:placeholder="#{label.descriptionPlaceholderBop}"
                      placeholder="Beschreibung der Product BOP…"
                      style="width:100%;padding:.5rem;
                             border:1px solid #ddd;
                             border-radius:4px;
                             font-family:inherit;
                             resize:vertical;"
                      th:text="${bop.description}">
            </textarea>
        </div>

        <!-- Buttons -->
        <div style="display:flex;gap:.5rem;margin-top:1.5rem;">
            <button type="submit" class="btn btn-primary">
                <span th:text="${isEdit} ? #{button.saveChangesIcon} : #{button.saveIcon}"></span>
            </button>
            <a th:href="${isEdit} ? @{/product-bop/{id}(id=${bop.id})} : @{/product-bop}"
               class="btn btn-primary"
               style="background:#6c757d;" th:text="#{button.cancelX}">
                ✖ Abbrechen
            </a>
        </div>

    </form>
    <!-- ── Ende Speichern-Formular ─────────────────────────── -->

</div>
</div>
</body>
</html>
