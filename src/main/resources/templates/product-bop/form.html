<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Product BOP bearbeiten – PEB' : 'Neue Product BOP – PEB'">
        Product BOP – PEB
    </title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="header">
    <div class="logo-placeholder">PEB</div>
    <h1 th:text="${isEdit} ? '✏️ Product BOP bearbeiten' : '➕ Neue Product BOP'">
        Product BOP
    </h1>
    <div style="margin-left:auto;">
        <a th:href="${isEdit} ? @{/product-bop/{id}(id=${bop.id})} : @{/product-bop}"
           class="btn btn-primary">← Zurück</a>
    </div>
</div>

<div class="container">
<div class="card" style="max-width:700px;">

    <!-- Info-Banner im Edit-Modus -->
    <div th:if="${isEdit}"
         style="background:#e7f3ff;border-left:4px solid #0056b3;
                padding:.75rem 1rem;border-radius:4px;
                margin-bottom:1.5rem;font-size:.9rem;">
        <strong>✏️ Bearbeitungsmodus</strong> –
        Product BOP ID:
        <code th:text="${bop.id}"></code>
        &nbsp;|&nbsp; Erstellt von:
        <span th:text="${bop.createdBy ?: '—'}"></span>
    </div>

    <!-- ── Speichern-Formular ──────────────────────────────── -->
    <form th:action="${isEdit} ? @{/product-bop/{id}/edit(id=${bop.id})} : @{/product-bop/new}"
          method="post">

        <!-- Name -->
        <div class="form-group">
            <label>Name *</label>
            <input type="text"
                   name="name"
                   th:value="${bop.name}"
                   required
                   placeholder="z.B. BOP – Akku-Bohrmaschine Montage">
        </div>

        <!-- Version -->
        <div class="form-group">
            <label>Version</label>
            <input type="text"
                   name="bopVersion"
                   th:value="${bop.bopVersion ?: '01'}"
                   placeholder="01">
        </div>

        <!-- Beschreibung -->
        <div class="form-group">
            <label>Beschreibung</label>
            <textarea name="description"
                      rows="3"
                      placeholder="Beschreibung der Product BOP…"
                      style="width:100%;padding:.5rem;
                             border:1px solid #ddd;
                             border-radius:4px;
                             font-family:inherit;
                             resize:vertical;"
                      th:text="${bop.description}">
            </textarea>
        </div>

        <!-- Buttons -->
        <div style="display:flex;gap:.5rem;margin-top:1.5rem;">
            <button type="submit" class="btn btn-primary">
                <span th:text="${isEdit} ? '💾 Änderungen speichern' : '💾 Speichern'"></span>
            </button>
            <a th:href="${isEdit} ? @{/product-bop/{id}(id=${bop.id})} : @{/product-bop}"
               class="btn btn-primary"
               style="background:#6c757d;">
                ✖ Abbrechen
            </a>
        </div>

    </form>
    <!-- ── Ende Speichern-Formular ─────────────────────────── -->

</div>
</div>
</body>
</html>
