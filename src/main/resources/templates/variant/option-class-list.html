<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="#{variant.options.title}">Variant Options - PEB</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .option-class-card {
            border: 1px solid #dee2e6;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }
        .option-class-header {
            background: #0066cc;
            color: #fff;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .option-class-body { padding: 1rem; }
        .option-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .option-table th { background: #f0f4ff; padding: 0.4rem 0.7rem; text-align: left; }
        .option-table td { padding: 0.4rem 0.7rem; border-bottom: 1px solid #e9ecef; }
        .badge-mandatory   { background:#d1e7dd; color:#0a3622; border:1px solid #badbcc; padding:0.2rem 0.5rem; border-radius:10px; font-size:0.75rem; }
        .badge-optional    { background:#fff3cd; color:#664d03; border:1px solid #ffecb5; padding:0.2rem 0.5rem; border-radius:10px; font-size:0.75rem; }
        .badge-single      { background:#cfe2ff; color:#084298; border:1px solid #b6d4fe; padding:0.2rem 0.5rem; border-radius:10px; font-size:0.75rem; }
        .badge-multi       { background:#e2e3e5; color:#41464b; border:1px solid #d3d6d8; padding:0.2rem 0.5rem; border-radius:10px; font-size:0.75rem; }
        .add-option-row td { background: #f8f9fa; }
        .add-option-row input, .add-option-row select { font-size:0.85rem; padding:0.25rem 0.4rem; }
        .new-class-form { background:#f8f9fa; border:2px dashed #0066cc; border-radius:6px; padding:1.25rem; margin-bottom:1.5rem; }
    </style>
</head>
<body>
<div class="header">
    <div class="logo-placeholder">PEB</div>
    <h1>🔀 <span th:text="#{variant.options.heading}">Variant Options Management</span></h1>
    <div style="margin-left:auto; display:flex; gap:0.5rem;">
        <a th:href="@{/variant/configurations}" class="btn btn-primary" th:text="#{variant.menu.configurations}">Configurations</a>
        <a th:href="@{/}" class="btn btn-primary" th:text="#{button.home}">Home</a>
    </div>
</div>

<div class="container">

    <!-- Flash messages -->
    <div th:if="${success}" class="alert" style="background:#d4edda;color:#155724;border:1px solid #c3e6cb;padding:0.75rem 1rem;border-radius:4px;margin-bottom:1rem;" th:text="${success}"></div>
    <div th:if="${error}"   class="alert" style="background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;padding:0.75rem 1rem;border-radius:4px;margin-bottom:1rem;" th:text="${error}"></div>

    <!-- ── Create New Option Class ──────────────────────────────── -->
    <div class="new-class-form" sec:authorize="hasAuthority('WRITE')">
        <h3 style="margin-top:0;" th:text="#{variant.options.newClass}">+ New Option Class</h3>
        <form th:action="@{/variant/options/classes}" method="post">
            <div style="display:flex; gap:0.75rem; flex-wrap:wrap; align-items:flex-end;">
                <div>
                    <label th:text="#{variant.options.classId}">Class ID (technical key)</label><br>
                    <input type="text" name="id" placeholder="e.g. ENGINE_TYPE" required
                           style="text-transform:uppercase; width:180px;">
                </div>
                <div>
                    <label th:text="#{label.name}">Name</label><br>
                    <input type="text" name="name" placeholder="e.g. Engine Type" required style="width:200px;">
                </div>
                <div>
                    <label th:text="#{variant.options.mandatory}">Mandatory?</label><br>
                    <select name="mandatory">
                        <option value="true"  th:text="#{variant.options.yes}">Yes</option>
                        <option value="false" th:text="#{variant.options.no}">No (optional)</option>
                    </select>
                </div>
                <div>
                    <label th:text="#{variant.options.singleSelect}">Single-select?</label><br>
                    <select name="singleSelect">
                        <option value="true"  th:text="#{variant.options.yes}">Yes (radio)</option>
                        <option value="false" th:text="#{variant.options.no}">No (multi)</option>
                    </select>
                </div>
                <div>
                    <button type="submit" class="btn btn-success" th:text="#{button.create}">Create</button>
                </div>
            </div>
        </form>
    </div>

    <!-- ── Existing Option Classes ──────────────────────────────── -->
    <div th:if="${optionClasses.empty}">
        <p style="color:#6c757d;" th:text="#{variant.options.noClasses}">No option classes defined yet.</p>
    </div>

    <div th:each="oc : ${optionClasses}" class="option-class-card">
        <div class="option-class-header">
            <strong th:text="${oc.id}">ENGINE_TYPE</strong>
            <span th:text="${oc.name}" style="font-weight:normal;opacity:0.9;">Engine Type</span>
            <span th:if="${oc.mandatory}"  class="badge-mandatory" th:text="#{variant.options.mandatory}">Mandatory</span>
            <span th:unless="${oc.mandatory}" class="badge-optional" th:text="#{variant.options.optionalClass}">Optional</span>
            <span th:if="${oc.singleSelect}"  class="badge-single" th:text="#{variant.options.singleSelect}">Single-select</span>
            <span th:unless="${oc.singleSelect}" class="badge-multi" th:text="#{variant.options.multiSelect}">Multi-select</span>
            <div style="margin-left:auto;">
                <form th:action="@{'/variant/options/classes/' + ${oc.id} + '/delete'}" method="post"
                      style="display:inline;"
                      sec:authorize="hasAuthority('WRITE')"
                      onsubmit="return confirm('Delete option class and all its options?')">
                    <button type="submit" class="btn btn-danger btn-xs" th:text="#{button.delete}">Delete</button>
                </form>
            </div>
        </div>
        <div class="option-class-body">
            <table class="option-table">
                <thead>
                    <tr>
                        <th th:text="#{variant.options.code}">Code</th>
                        <th th:text="#{label.name}">Name</th>
                        <th th:text="#{variant.options.ruleToken}">Rule Token</th>
                        <th th:text="#{variant.options.sortOrder}">Order</th>
                        <th sec:authorize="hasAuthority('WRITE')" th:text="#{label.actions}">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="opt : ${oc.options}">
                        <td><code th:text="${opt.code}">V8</code></td>
                        <td th:text="${opt.name}">V8 Motor 4.0L</td>
                        <td><code th:text="${oc.id + '=' + opt.code}" style="color:#1b5e20;">ENGINE_TYPE=V8</code></td>
                        <td th:text="${opt.sortOrder}">0</td>
                        <td sec:authorize="hasAuthority('WRITE')">
                            <form th:action="@{'/variant/options/' + ${opt.id} + '/delete'}"
                                  method="post" style="display:inline;"
                                  onsubmit="return confirm('Delete option?')">
                                <button type="submit" class="btn btn-danger btn-xs" th:text="#{button.delete}">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <!-- Add-option row -->
                    <tr class="add-option-row" sec:authorize="hasAuthority('WRITE')">
                        <td colspan="5">
                            <form th:action="@{'/variant/options/classes/' + ${oc.id} + '/add'}" method="post"
                                  style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center;">
                                <input type="text"   name="code"      placeholder="Code (e.g. V8)" required style="width:120px; text-transform:uppercase;">
                                <input type="text"   name="name"      placeholder="Name" required style="width:180px;">
                                <input type="number" name="sortOrder" placeholder="Order" value="0" style="width:70px;">
                                <button type="submit" class="btn btn-success btn-xs">+ <span th:text="#{variant.options.addOption}">Add Option</span></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
