<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.title}">SEP4Eng - Synchronous Engineering Platform</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{css/brand/styles/frontend-kit-complete.css}">
    <link rel="stylesheet" th:href="@{css/brand/styles/brands/bosch/styles/semantic/index.css}">
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <style>
        .app-layout {
            display: flex;
            align-items: flex-start;
        }
        .app-layout__content {
            flex: 1 1 auto;
            min-width: 0;
        }
    </style>
</head>
<body>

    <!-- ── Header (Fragment) ─────────────────────────────────── -->
    <div th:replace="~{fragments/header :: header(#{cim.heading})}"></div>

    <div class="app-layout">

        <!-- ── Side-Navigation (Fragment) ────────────────────── -->
        <div th:replace="~{fragments/side-navigation :: side-navigation}"></div>

        <div class="app-layout__content">

            <div class="container">
                <!-- Alerts -->
                <div th:if="${successMessage}" class="alert alert-success" style="margin-bottom:1rem;" th:text="${successMessage}">Success</div>
                <div th:if="${errorMessage}" class="alert alert-danger" style="margin-bottom:1rem;" th:text="${errorMessage}">Error</div>

                <!-- Create from MAE Card -->
                <div class="card" sec:authorize="hasAuthority('WRITE')" style="margin-bottom:1.5rem;">
                    <h3 style="margin-top:0;" th:text="#{cim.createFromMae}">Create CIM from MAE</h3>
                    <form th:action="@{/cim/from-mae}" method="post" style="display:flex; gap:.5rem; flex-wrap:wrap; align-items:center;">
                        <select name="maeObjectId" required class="a-dropdown" style="min-width:380px; padding:0.5rem;">
                            <option value="" th:text="#{cim.selectMae}">-- Select MAE object --</option>
                            <option th:each="m : ${maeObjects}" th:value="${m.id}" th:text="${m.id + ' - ' + m.name + ' (' + m.objectType.displayName + ')'}">MA00000001</option>
                        </select>
                        <button type="submit" class="a-button a-button--primary">
                            <i class="a-icon a-button__icon boschicon-bosch-ic-add"></i>
                            <span class="a-button__label" th:text="#{cim.createCim}">Create CIM</span>
                        </button>
                    </form>
                </div>

                <!-- Table Card -->
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                        <h3 style="margin:0;" th:text="#{cim.listHeading}">CIM Objects</h3>
                        <form th:action="@{/cim}" method="get" style="display:flex; align-items:center; gap:.5rem; margin:0;">
                            <label for="scope" th:text="#{cim.list.scope.label}">View</label>
                            <select id="scope" name="scope" onchange="this.form.submit()" style="max-width:260px; padding:0.25rem 0.5rem;">
                                <option value="top" th:selected="${listScope == 'top'}" th:text="#{cim.list.scope.top}">Top nodes (Machines)</option>
                                <option value="all" th:selected="${listScope == 'all'}" th:text="#{cim.list.scope.all}">All CIM objects</option>
                            </select>
                        </form>
                    </div>

                    <table class="m-table" aria-label="CIM Objects">
                        <thead>
                            <tr>
                                <th th:text="#{cim.column.id}">CIM ID</th>
                                <th th:text="#{label.name}">Name</th>
                                <th th:text="#{cim.sourceMae}">Source MAE</th>
                                <th th:text="#{label.status}">Status</th>
                                <th style="text-align: right;" th:text="#{label.actions}">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(cimObjects)}">
                                <td colspan="5" style="text-align:center; color:#888;" th:text="#{cim.none}">No CIM objects</td>
                            </tr>
                            <tr th:each="c : ${cimObjects}">
                                <td>
                                    <a th:href="@{'/cim/' + ${c.id}}" th:text="${c.id}">CI00000001</a>
                                </td>
                                <td th:text="${c.name}">Name</td>
                                <td th:text="${c.sourceMaeObjectId + ' (' + c.sourceMaeObjectType + ')'}">MA00000001</td>
                                <td>
                                    <span th:text="${c.latestRevision != null ? c.latestRevision.releaseStatus : #messages.msg('common.unknown')}">WORKING</span>
                                </td>
                                <td style="text-align: right;">
                                    <div class="a-link -icon">
                                        <a th:href="@{'/cim/' + ${c.id}}" target="_self">
                                            <span></span>
                                            <span>[[#{button.details}]]<i class="a-icon ui-ic-nosafe-lr-forward-small"></i></span>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ── Footer (Fragment) ─────────────────────────── -->
            <div th:replace="~{fragments/footer :: footer}"></div>

        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
