<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.title}">SEP4Eng - Synchronous Engineering Platform</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{css/brand/styles/frontend-kit-complete.css}">
    <link rel="stylesheet" th:href="@{css/brand/styles/brands/bosch/styles/semantic/index.css}">
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <style>
        /* einfaches Layout: Side-Navigation links, Inhalt rechts */
        .app-layout {
            display: flex;
            align-items: flex-start;
        }
        .app-layout__content {
            flex: 1 1 auto;
            min-width: 0;
        }
    </style>
</head>
<body>

    <!-- ── Header (Fragment) ─────────────────────────────────── -->
    <div th:replace="~{fragments/header :: header(#{supplier.title})}"></div>

    <div class="app-layout">

        <!-- ── Side-Navigation (Fragment) ────────────────────── -->
        <div th:replace="~{fragments/side-navigation :: side-navigation}"></div>

        <div class="app-layout__content">

			<div class="frontend-kit__example-wrapper -secondary">
				<div class="e-container" style="margin: 1rem auto;">
					<div class="frontend-kit__example-wrapper -primary">
            <div class="container">
                <div class="card">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
                        <h3 style="margin:0"><span th:text="#{supplier.heading}">Supplier</span> (<span th:text="${suppliers.size()}"></span>)</h3>
                        <sec:authorize="hasAuthority('WRITE')">

							<button type="button" class="a-button a-button--primary" th:onclick="|window.location.href='@{/suppliers/new}'|" >
							  <i class="a-icon a-button__icon boschicon-bosch-ic-add"></i>
								<span class="a-button__label" th:text="#{button.newSupplier}">New suppiler</span>
							</button>

						</sec:authorize>
                    </div>

                    <!-- Such- und Filterleiste -->
                    <form method="get" style="display:flex; gap:.5rem; margin-bottom:1rem;">
                        <div class="a-text-field">
                            <input type="text"
                                   name="search"
                                   th:value="${search}"
                                   th:placeholder="#{design.searchPlaceholder}"
                                   placeholder="Search name / ID / department...">
                        </div>

                        <button type="submit" class="a-button a-button--primary">
                            <i class="a-icon a-button__icon boschicon-bosch-ic-search"></i>
                            <span class="a-button__label" th:text="#{button.searchPlain}">Search</span>
                        </button>

                        <button type="button" class="a-button a-button--primary" th:onclick="|window.location.href='@{/suppliers}'|">
                            <i class="a-icon a-button__icon boschicon-bosch-ic-reset"></i>
                            <span class="a-button__label" th:text="#{button.reset}">Reset</span>
                        </button>
						
                    </form>

					<table class="m-table" aria-label="Suppliers">
						<thead>
						<tr>
							<th th:text="#{label.id}">ID</th>
							<th th:text="#{label.name}">Name</th>
							<th th:text="#{label.city}">Ort</th>
							<th th:text="#{label.country}">Land</th>
							<th th:text="#{common.status}">Status</th>
							<th th:text="#{label.releasedRevision}">Freigeg. Rev.</th>
							<th></th>
						</tr>
						</thead>
						<tbody>
						<tr th:each="s : ${suppliers}">
							<td th:text="${s.id}"></td>
							<td><a th:href="@{'/suppliers/' + ${s.id}}" th:text="${s.name}"></a></td>
							<td th:text="${s.city}"></td>
							<td th:text="${s.country}"></td>
							<td class="-with-icon-and-label" th:switch="${s.status}">
								<i th:case="'ACTIVE'" class="a-icon boschicon-bosch-ic-checkmark"></i>
								<i th:case="'UNDER_REVIEW'" class="a-icon boschicon-bosch-ic-clock"></i>
								<i th:case="'BLOCKED'" class="a-icon boschicon-bosch-ic-shield-stop"></i>
								<i th:case="*" class="a-icon boschicon-bosch-ic-alert-error"></i>
								<span th:if="${s.status != null and s.status.name() == 'ACTIVE'}" th:text="#{material.status.active}"></span>
								<span th:if="${s.status != null and s.status.name() == 'UNDER_REVIEW'}" th:text="#{material.status.underReview}"></span>
								<span th:if="${s.status != null and s.status.name() == 'OBSOLETE'}" th:text="#{material.status.obsolete}"></span>
								<span th:if="${s.status != null and s.status.name() == 'BLOCKED'}" th:text="#{material.status.blocked}"></span>
							</td>
							<td th:text="${s.releasedRevision ?: '–'}"></td>
							<td>
								<div class="a-link -icon">
									<a th:href="@{'/suppliers/' + ${s.id}}" target="_self">
										<span></span>
										<span>[[#{button.details}]]</span>
									</a>
								</div>
							</td>
						</tr>
						<tr th:if="${suppliers.isEmpty()}">
							<td colspan="7" style="text-align:center;color:#888" th:text="#{supplier.noneYet}">Noch keine Lieferanten angelegt.</td>
						</tr>
						</tbody>
					</table>
                </div>
            </div>
					</div>
				</div>
			</div>

            <!-- ── Footer (Fragment) ─────────────────────────── -->
            <div th:replace="~{fragments/footer :: footer}"></div>

        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
