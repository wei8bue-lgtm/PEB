<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isNew} ? #{supplier.newTitle} : #{supplier.editTitle}"></title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/brand/styles/frontend-kit-complete.css}">
    <link rel="stylesheet" th:href="@{/css/brand/styles/brands/bosch/styles/semantic/index.css}">
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <style>
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem 1.5rem; }
        .form-grid .full { grid-column: 1 / -1; }
        .form-group label { font-size:.85rem; color:#555; margin-bottom:.25rem; display:block; font-weight:600; }
        .form-group input, .form-group select, .form-group textarea {
            width:100%; padding:.5rem .7rem; border:1px solid #ced4da; border-radius:4px; font-size:.9rem;
        }
        .section-title { margin-top:1.5rem; margin-bottom:.5rem; font-size:1rem; color:#333; border-bottom:1px solid #eee; padding-bottom:.3rem; }
        .app-layout { display:flex; align-items:flex-start; }
        .app-layout__content { flex:1 1 auto; min-width:0; }
        .card form .a-text-field { margin-bottom:1.25rem; }
        .a-text-area { margin-top:1.5rem; }
        .a-text-area textarea {
            pointer-events:auto !important;
            overflow-y:auto !important;
            -webkit-user-select:text;
            user-select:text;
            cursor:text;
            width:100%;
            box-sizing:border-box;
            min-height:160px;
            max-height:300px;
            resize:vertical;
        }
        label[for="status"] {
            position:static !important;
            display:block;
            margin-bottom:.35rem;
        }
        #status {
            width:100%;
            padding:.5rem;
            border:1px solid #ced4da;
            border-radius:4px;
            box-sizing:border-box;
            position:static;
        }
        .a-text-field--select {
            height:auto !important;
            min-height:0 !important;
            overflow:visible !important;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header(#{supplier.title})}"></div>

<div class="app-layout">
    <div th:replace="~{fragments/side-navigation :: side-navigation}"></div>
    <div class="app-layout__content">
        <div class="frontend-kit__example-wrapper -secondary">
            <div class="e-container" style="margin:1rem auto;">
                <div class="frontend-kit__example-wrapper -primary">
<div class="container">
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
            <h2 th:text="${isNew} ? #{supplier.newHeading} : #{supplier.editHeading} + ' ' + ${supplier.id}"></h2>
			
			<button type="button" class="a-button a-button--primary" th:onclick="|window.location.href='@{/suppliers}'|">
				<i class="a-icon a-button__icon boschicon-bosch-ic-reset"></i>
				<span class="a-button__label" th:text="#{button.backToList}">Zur Liste</span>
			</button>
			
        </div>
        <form th:action="${isNew} ? @{/suppliers} : @{'/suppliers/' + ${supplier.id}}" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>

            <div class="section-title" th:text="#{material.masterData}">Stammdaten</div>
            <div class="form-grid">
                <div class="form-group a-text-field full">
                    <label th:text="#{label.name} + ' *'">Name *</label>
                    <input type="text" name="name" th:value="${supplier.name}" required>
                </div>
                <div class="a-text-field a-text-field--select">
                    <label for="status" th:text="#{common.status}">Status</label>
                    <select id="status" name="status">
                        <option value="ACTIVE"       th:selected="${supplier.status == null || supplier.status.name() == 'ACTIVE'}" th:text="#{material.status.active}">Aktiv</option>
                        <option value="UNDER_REVIEW" th:selected="${supplier.status != null and supplier.status.name() == 'UNDER_REVIEW'}" th:text="#{material.status.underReview}">In Prüfung</option>
                        <option value="OBSOLETE"     th:selected="${supplier.status != null and supplier.status.name() == 'OBSOLETE'}" th:text="#{material.status.obsolete}">Ausgelaufen</option>
                        <option value="BLOCKED"      th:selected="${supplier.status != null and supplier.status.name() == 'BLOCKED'}" th:text="#{material.status.blocked}">Gesperrt</option>
                    </select>
                </div>
                <div class="form-group a-text-field">
                    <label th:text="#{label.street}">Straße / Hausnummer</label>
                    <input type="text" name="street" th:value="${supplier.street}">
                </div>
                <div class="form-group a-text-field">
                    <label th:text="#{label.zipCode}">PLZ</label>
                    <input type="text" name="zipCode" th:value="${supplier.zipCode}">
                </div>
                <div class="form-group a-text-field">
                    <label th:text="#{label.city}">Ort</label>
                    <input type="text" name="city" th:value="${supplier.city}">
                </div>
                <div class="form-group a-text-field">
                    <label th:text="#{label.country}">Land</label>
                    <input type="text" name="country" th:value="${supplier.country}" placeholder="z.B. Deutschland">
                </div>
            </div>

            <div class="section-title" th:text="#{supplier.contact}">Kontakt</div>
            <div class="form-grid">
                <div class="form-group a-text-field">
                    <label th:text="#{label.contactPerson}">Ansprechpartner</label>
                    <input type="text" name="contactPerson" th:value="${supplier.contactPerson}">
                </div>
                <div class="form-group a-text-field">
                    <label th:text="#{label.email}">E-Mail</label>
                    <input type="email" name="contactEmail" th:value="${supplier.contactEmail}">
                </div>
                <div class="form-group a-text-field">
                    <label th:text="#{label.phone}">Telefon</label>
                    <input type="text" name="contactPhone" th:value="${supplier.contactPhone}">
                </div>
                <div class="form-group">
                    <label th:text="#{label.website}">Website</label>
                    <input type="text" name="website" th:value="${supplier.website}" placeholder="https://…">
                </div>
            </div>

            <div class="section-title" th:text="#{compliance.notes}">Notizen</div>
            <div class="a-text-area">
                <textarea name="notes" rows="4" th:text="${supplier.notes}"></textarea>
            </div>

            <div style="margin-top:1.5rem;display:flex;gap:.75rem">
                <button type="submit" class="a-button a-button--primary">
                    <i class="a-icon a-button__icon" th:classappend="${isNew} ? ' boschicon-bosch-ic-add' : ' boschicon-bosch-ic-save'"></i>
                    <span class="a-button__label" th:text="${isNew} ? #{button.createSupplier} : #{button.saveChanges}"></span>
                </button>
				
				<button type="button" class="a-button a-button--destructive-primary" th:onclick="|window.location.href='@{/suppliers}'|">
					<i class="a-icon a-button__icon boschicon-bosch-ic-reset"></i>
					<span class="a-button__label" th:text="#{button.cancel}">Cancel</span>
				</button>
			
            </div>
        </form>
    </div>
</div>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>
</body>
</html>
