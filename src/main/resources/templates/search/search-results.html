<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{search.title}">Suche - SEP4Eng</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{css/brand/styles/frontend-kit-complete.css}">
    <link rel="stylesheet" th:href="@{css/brand/styles/brands/bosch/styles/semantic/index.css}">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <style>
        /* einfaches Layout: Side-Navigation links, Inhalt rechts */
        .app-layout {
            display: flex;
            align-items: flex-start;
        }
        .app-layout__content {
            flex: 1 1 auto;
            min-width: 0;
        }
    </style>
</head>
<body>

    <!-- ── Header (Fragment) ─────────────────────────────────── -->
    <div th:replace="~{fragments/header :: header(#{search.title})}"></div>

    <div class="app-layout">

        <!-- ── Side-Navigation (Fragment) ────────────────────── -->
        <div th:replace="~{fragments/side-navigation :: side-navigation}"></div>

        <div class="app-layout__content">

            <!-- ── Hauptinhalt ─────────────────────────────────────────── -->
            <div class="frontend-kit__example-wrapper -secondary">
              <div class="e-container" style="margin: 2rem auto;">

                <div class="frontend-kit__example-wrapper -primary">

                    <h3 th:text="#{search.resultsHeading}">Suchergebnisse</h3>

                    <form th:action="@{/search}" method="get" style="display:flex; flex-wrap:wrap; gap:.75rem; align-items:flex-end; margin-top:1.25rem;">
                        <div class="a-text-field" style="flex:1 1 320px; min-width:220px;">
                            <input type="text" name="q"
                                   th:value="${result != null} ? ${result.query} : ''"
                                   th:placeholder="#{search.placeholder}" placeholder="Suche nach Name, ID, Material... (auch mit * und ?)"/>
                        </div>

                        <div class="select-field" style="flex:0 1 220px;">
                            <select name="type">
                                <option value="" th:text="#{label.allTypes}">Alle Typen</option>
                                <option th:each="ot : ${objectTypes}"
                                        th:value="${ot}"
                                        th:text="${ot.displayName}"
                                        th:selected="${ot == selectedType}"></option>
                            </select>
                        </div>

                        <div class="select-field" style="flex:0 1 180px;">
                            <select name="status">
                                <option value="" th:text="#{label.allStatuses}">Alle Status</option>
                                <option value="WORKING"  th:selected="${selectedStatus == 'WORKING'}">Working</option>
                                <option value="RELEASED" th:selected="${selectedStatus == 'RELEASED'}">Released</option>
                                <option value="OBSOLETE" th:selected="${selectedStatus == 'OBSOLETE'}">Obsolete</option>
                            </select>
                        </div>

                        <button type="submit" class="a-button a-button--primary">
							<i class="a-icon a-button__icon boschicon-bosch-ic-search"></i>
                            <span class="a-button__label" th:text="#{button.searchPlain}">Suchen</span>
                        </button>					

                    </form>

                    <p style="font-size:0.85em; color:#6b7280; margin-top:.75rem;">
                        <span th:text="#{search.hint}">Tipp:</span> <code>*</code> <span th:text="#{search.hintAnyChars}">für beliebig viele Zeichen,</span> <code>?</code> <span th:text="#{search.hintExactChar}">für genau ein Zeichen –</span>
                        <code>Mot*</code> <span th:text="#{ebom.noDocumentHintOr}">oder</span> <code>PT0000*</code>.
                    </p>

                    <div th:if="${result == null}" class="a-notification" role="alert">
                        <i class="a-icon ui-ic-alert-info"></i>
                        <div class="a-notification__content" th:text="#{search.enterQueryPrompt}">
                            Bitte geben Sie einen Suchbegriff ein.
                        </div>
                    </div>

                    <div th:if="${result != null and result.searchUnavailable}" class="a-notification -warning" role="alert">
                        <i class="a-icon ui-ic-alert-warning"></i>
                        <div class="a-notification__content" th:text="#{search.unavailable}">
                            Die Suche ist gerade nicht erreichbar. Bitte versuchen Sie es in Kürze erneut.
                        </div>
                    </div>

                    <div th:if="${result != null and !result.searchUnavailable}">

                        <p style="color:#6b7280; margin:1.25rem 0 1rem;"
                           th:text="#{search.hitsFor(${result.totalHits}, ${result.query})}"></p>

                        <div th:if="${result.results.empty}" class="a-notification" role="alert">
                            <i class="a-icon ui-ic-alert-info"></i>
                            <div class="a-notification__content" th:text="#{search.noHitsFound}">
                                Keine Treffer gefunden.
                            </div>
                        </div>

                        <table th:unless="${result.results.empty}" class="m-table" aria-label="Suchergebnisse">
                            <thead>
                                <tr>
                                    <th th:text="#{label.name}">Name</th>
                                    <th th:text="#{label.type}">Typ</th>
                                    <th th:text="#{label.id}">ID</th>
                                    <th th:text="#{label.revision}">Revision</th>
                                    <th th:text="#{common.status}">Status</th>
                                    <th th:text="#{label.department}">Department</th>
                                    <th th:text="#{label.lastModified}">Zuletzt geändert</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="doc : ${result.results}">
                                    <td>
                                        <div class="a-link -icon">
                                            <a th:href="${doc.detailUrl}" target="_self">
                                                <span></span>
                                                <span th:text="${doc.name}"></span>
                                            </a>
                                        </div>
                                    </td>
                                    <td th:text="${doc.objectTypeDisplayName}"></td>
                                    <td th:text="${doc.objectId}"></td>
                                    <td th:text="${doc.revision}"></td>
                                    <td>
                                        <span class="status-badge"
                                              th:classappend="'status-' + ${#strings.toLowerCase(doc.releaseStatus)}"
                                              th:text="${doc.releaseStatus}"></span>
                                    </td>
                                    <td th:text="${doc.department}"></td>
                                    <td th:text="${#temporals.format(doc.lastModifiedDate, 'dd.MM.yyyy HH:mm')}"></td>
                                </tr>
                            </tbody>
                        </table>

                        <!-- Paginierung der Suchergebnis-Seiten -->
                        <div th:if="${result.totalPages > 1}" style="margin-top:1.25rem; display:flex; gap:.5rem;">
                            <a th:each="p : ${#numbers.sequence(0, result.totalPages - 1)}"
                               th:href="@{/search(q=${result.query}, type=${selectedType}, status=${selectedStatus}, page=${p})}"
                               th:classappend="${p == result.page} ? 'a-button--brand-primary' : 'a-button--neutral-secondary'"
                               class="a-button -small">
                                <span class="a-button__label" th:text="${p + 1}"></span>
                            </a>
                        </div>

                    </div>

                </div>
              </div>
            </div>

            <!-- ── Footer (Fragment) ─────────────────────────── -->
            <div th:replace="~{fragments/footer :: footer}"></div>

        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
