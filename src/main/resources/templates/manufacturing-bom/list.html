<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="#{mfgBom.title}">Manufacturing BOM – PEB</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="header">
    <div class="logo-placeholder">PEB</div>
    <h1 th:text="#{mfgBom.heading}">🔧 Manufacturing BOM</h1>
    <div style="margin-left:auto; display:flex; gap:.5rem;">
        <a th:href="@{/}" class="btn btn-primary">🏠 <span th:text="#{button.home}">Home</span></a>
    </div>
</div>

<div class="container">

    <!-- ── Flash ─────────────────────────────────────────────── -->
    <div th:if="${successMessage}" class="card"
         style="background:#d4edda; border-color:#c3e6cb;
                padding:1rem; margin-bottom:1rem;">
        <p style="margin:0; color:#155724;"
           th:text="${successMessage}"></p>
    </div>
    <div th:if="${errorMessage}" class="card"
         style="background:#f8d7da; border-color:#f5c6cb;
                padding:1rem; margin-bottom:1rem;">
        <p style="margin:0; color:#721c24;"
           th:text="${errorMessage}"></p>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between;
                    align-items:center; margin-bottom:1rem;">
            <h2 style="margin:0;" th:text="#{mfgBom.listHeading}">Manufacturing BOM Liste</h2>
            <a th:href="@{/manufacturing-bom/new}"
               class="btn btn-primary"
               sec:authorize="hasAuthority('WRITE')" th:text="#{button.newMfgBom}">
                ➕ Neue Mfg BOM
            </a>
        </div>

        <!-- ── Suche ─────────────────────────────────────────── -->
        <form method="get"
              style="display:flex; gap:.5rem;
                     margin-bottom:1.5rem;">
            <input type="text"
                   name="search"
                   th:value="${search}"
                   th:placeholder="#{mfgBom.searchPlaceholder}" placeholder="Name suchen…"
                   class="search-box"
                   style="flex:1; max-width:400px;">
            <button type="submit" class="btn btn-primary">
                🔍 <span th:text="#{button.searchPlain}">Suchen</span>
            </button>
            <a th:href="@{/manufacturing-bom}"
               class="btn btn-primary">✖ <span th:text="#{button.reset}">Reset</span></a>
        </form>

        <!-- ── Tabelle ───────────────────────────────────────── -->
        <table style="width:100%; border-collapse:collapse;">
            <thead>
                <tr style="background:#f8f9fa;
                           border-bottom:2px solid #ddd;">
                    <th style="padding:.75rem; text-align:left;" th:text="#{label.id}">
                        ID
                    </th>
                    <th style="padding:.75rem; text-align:left;" th:text="#{label.name}">
                        Name
                    </th>
                    <th style="padding:.75rem; text-align:left;" th:text="#{label.version}">
                        Version
                    </th>
                    <th style="padding:.75rem; text-align:left;" th:text="#{common.status}">
                        Status
                    </th>
                    <th style="padding:.75rem; text-align:left;" th:text="#{label.productBoms}">
                        Product BOMs
                    </th>
                    <th style="padding:.75rem; text-align:left;" th:text="#{label.operations}">
                        Operationen
                    </th>
                    <th style="padding:.75rem; text-align:left;" th:text="#{lifecycle.history.createdBy}">
                        Erstellt von
                    </th>
                    <th style="padding:.75rem; text-align:left;" th:text="#{label.createdDate}">
                        Erstellt am
                    </th>
                    <th style="padding:.75rem; text-align:left;" th:text="#{label.actions}">
                        Aktionen
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(mfgBomList)}">
                    <td colspan="9"
                        style="padding:2rem; text-align:center;
                               color:#6c757d;" th:text="#{mfgBom.noneFound}">
                        Keine Manufacturing BOMs vorhanden.
                    </td>
                </tr>

                <tr th:each="bom : ${mfgBomList}"
                    style="border-bottom:1px solid #eee;">

                    <!-- ID -->
                    <td style="padding:.75rem;
                               font-family:monospace;
                               font-weight:600;"
                        th:text="${bom.id}">
                    </td>

                    <!-- Name -->
                    <td style="padding:.75rem;">
                        <a th:href="@{/manufacturing-bom/{id}(id=${bom.id})}"
                           th:text="${bom.name}"
                           style="color:#0066cc; font-weight:500;
                                  text-decoration:none;">
                        </a>
                    </td>

                    <!-- Version -->
                    <td style="padding:.75rem; text-align:center;">
                        <span style="font-size:.8rem;
                                     padding:2px 8px;
                                     background:#e9ecef;
                                     border-radius:10px;"
                              th:text="${bom.bomVersion}">01</span>
                    </td>

                    <!-- Status -->
                    <td style="padding:.75rem;">
                        <th:block th:with="sn=${bom.latestStatusName}">
                            <span th:if="${sn == 'WORKING'}"
                                  style="display:inline-block;
                                         padding:.25rem .6rem;
                                         border-radius:4px;
                                         font-size:.8rem;
                                         font-weight:600;
                                         background:#fff3cd;
                                         color:#856404;
                                         border:1px solid #ffc107;">
                                ⚙️ WORKING
                            </span>
                            <span th:if="${sn == 'RELEASED'}"
                                  style="display:inline-block;
                                         padding:.25rem .6rem;
                                         border-radius:4px;
                                         font-size:.8rem;
                                         font-weight:600;
                                         background:#d4edda;
                                         color:#155724;
                                         border:1px solid #28a745;">
                                ✅ RELEASED
                            </span>
                            <span th:if="${sn == 'OBSOLETE'}"
                                  style="display:inline-block;
                                         padding:.25rem .6rem;
                                         border-radius:4px;
                                         font-size:.8rem;
                                         font-weight:600;
                                         background:#f8d7da;
                                         color:#721c24;
                                         border:1px solid #f5c6cb;">
                                🔒 OBSOLETE
                            </span>
                            <span th:if="${sn == 'KEINE_REVISION'}"
                                  style="display:inline-block;
                                         padding:.25rem .6rem;
                                         border-radius:4px;
                                         font-size:.8rem;
                                         background:#f8f9fa;
                                         color:#6c757d;
                                         border:1px solid #dee2e6;">
                                <span th:text="#{status.noRevision}">— Keine Revision</span>
                            </span>
                        </th:block>
                    </td>

                    <!-- Product BOMs -->
                    <td style="padding:.75rem; text-align:center;
                               font-weight:600;"
                        th:text="${#lists.size(bom.productBOMs)}">
                    </td>

                    <!-- Operationen -->
                    <td style="padding:.75rem; text-align:center;
                               font-weight:600;"
                        th:text="${#lists.size(bom.operations)}">
                    </td>

                    <!-- Erstellt von -->
                    <td style="padding:.75rem; font-size:.85rem;"
                        th:text="${bom.createdBy ?: '—'}">
                    </td>

                    <!-- Erstellt am -->
                    <td style="padding:.75rem; font-size:.85rem;
                               color:#6c757d;"
                        th:text="${bom.createdDate != null
                            ? #temporals.format(bom.createdDate,
                                'dd.MM.yyyy')
                            : '—'}">
                    </td>

                    <!-- Aktionen -->
                    <td style="padding:.75rem;">
                        <div style="display:flex; gap:.35rem;
                                    align-items:center;
                                    flex-wrap:wrap;">

                            <!-- Arbeitsanweisung -->
                            <a th:href="@{/manufacturing-bom/{id}/work-instruction(id=${bom.id})}"
                               class="btn btn-primary btn-sm"
                               target="_blank"
                               th:title="#{title.workInstruction}" title="Arbeitsanweisung">📄</a>

                            <!-- View -->
                            <a th:href="@{/manufacturing-bom/{id}(id=${bom.id})}"
                               class="btn btn-primary btn-sm"
                               th:title="#{button.view}" title="Anzeigen">👁️</a>

                            <!-- Edit – nur bei WORKING -->
                            <div sec:authorize="hasAuthority('WRITE')">
                                <a th:if="${bom.latestStatusName == 'WORKING'}"
                                   th:href="@{/manufacturing-bom/{id}/edit(id=${bom.id})}"
                                   class="btn btn-primary btn-sm"
                                   th:title="#{button.edit}" title="Bearbeiten"
                                   style="background:#ffc107;
                                          color:#212529;
                                          border-color:#ffc107;">
                                    ✏️
                                </a>
                            </div>

                            <!-- Delete -->
                            <div sec:authorize="hasAuthority('DELETE')">

                                <!-- Löschen erlaubt -->
                                <form th:if="${bom.latestStatusName == 'WORKING'
                                              and #lists.isEmpty(bom.productBOMs)}"
                                      th:action="@{/manufacturing-bom/{id}/delete(id=${bom.id})}"
                                      method="post"
                                      th:attr="onsubmit=|return confirm('${#strings.escapeJavaScript(#messages.msg('mfgBom.confirmDelete', bom.name))}');|">
                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}"/>
                                    <button type="submit"
                                            class="btn btn-danger btn-sm"
                                            th:title="#{button.delete}" title="Löschen">
                                        🗑️
                                    </button>
                                </form>

                                <!-- Löschen gesperrt – Status -->
                                <button th:if="${bom.latestStatusName == 'RELEASED'
                                                or bom.latestStatusName == 'OBSOLETE'}"
                                        type="button" disabled
                                        class="btn btn-sm"
                                        style="background:#e9ecef;
                                               color:#6c757d;
                                               cursor:not-allowed;
                                               border:1px solid #dee2e6;"
                                        th:title="#{mfgBom.deleteBlockedStatus}" title="Löschen nicht möglich: Status ist nicht WORKING">
                                    🔒
                                </button>

                                <!-- Löschen gesperrt – verknüpft -->
                                <button th:if="${bom.latestStatusName == 'WORKING'
                                                and !#lists.isEmpty(bom.productBOMs)}"
                                        type="button" disabled
                                        class="btn btn-sm"
                                        style="background:#e9ecef;
                                               color:#6c757d;
                                               cursor:not-allowed;
                                               border:1px solid #dee2e6;"
                                        th:title="#{mfgBom.deleteBlockedLinked(${#lists.size(bom.productBOMs)})}">
                                    🔒
                                </button>
                            </div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <div style="margin-top:1rem; font-size:.85rem;
                    color:#6c757d;">
            <span th:text="#{mfgBom.total}">Gesamt:</span>
            <strong th:text="${#lists.size(mfgBomList)}">0</strong>
            <span th:text="#{mfgBom.entries}">Einträge</span>
        </div>
    </div>
</div>
</body>
</html>
