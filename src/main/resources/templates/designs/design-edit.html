<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Edit Design - PEB</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover { background-color: #5a6268; }

        /* Child_View Textarea */
        .form-group textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            min-height: 120px;
            box-sizing: border-box;
        }
        .form-group textarea:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 2px rgba(13,110,253,0.15);
        }
        .char-counter {
            font-size: 0.78rem;
            color: #6c757d;
            text-align: right;
            margin-top: 0.2rem;
        }
        .char-counter.warn  { color: #fd7e14; }
        .char-counter.limit { color: #dc3545; }

        .field-note {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 0.2rem;
        }
        .readonly-note {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 0.2rem;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo-placeholder">PEB</div>
    <h1>Edit Design</h1>
    <div style="margin-left: auto;">
        <a th:href="@{/designs/{id}(id=${designId})}"
           class="btn btn-primary">Back to Design</a>
    </div>
</div>

<div class="container">
    <div class="card">
        <h2>Edit Design Information</h2>

        <form th:action="@{/designs/{id}(id=${designId})}"
              th:object="${design}"
              method="post">

            <!-- Name -->
            <div class="form-group">
                <label for="name">Name *</label>
                <input type="text" id="name"
                       th:field="*{name}"
                       required maxlength="256">
            </div>

            <!-- Department -->
            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department"
                       th:field="*{department}"
                       maxlength="128">
            </div>

            <!-- Mass -->
            <div class="form-group">
                <label for="mass">Mass (kg)</label>
                <input type="text" id="mass"
                       th:field="*{mass}"
                       maxlength="8">
                <div class="field-note">
                    Wird automatisch an verlinkte eBOM-Objekte synchronisiert.
                </div>
            </div>

            <!-- Material (readonly – wird von eBOM synchronisiert) -->
            <div class="form-group">
                <label for="material">Material</label>
                <input type="text" id="material"
                       th:field="*{material}"
                       maxlength="256"
                       readonly
                       style="background:#f8f9fa; cursor:not-allowed;">
                <div class="readonly-note">
                    ⚠ Wird automatisch vom verlinkten eBOM-Objekt synchronisiert
                    (schreibgeschützt).
                </div>
            </div>

			<!-- Child_View -->
			<div class="form-group">
				<label for="childView">Child View</label>
				<textarea id="childView"
						  th:field="*{childView}"
						  oninput="updateCharCounter(this)"
						  placeholder="Strukturbeschreibung / Stücklisteninhalt ...">
				</textarea>
				<!--
					maxlength entfernt – CLOB hat keine sinnvolle
					HTML-seitige Längenbeschränkung
				-->
				<div class="char-counter" id="childViewCounter">
					0 Zeichen
				</div>
				<div class="field-note">
					Datentyp: Oracle CLOB (keine Längenbeschränkung).
				</div>
			</div>

            <!-- Buttons -->
            <div style="margin-top:2rem; display:flex; gap:0.75rem;">
                <button type="submit" class="btn btn-success">
                    💾 Save Changes
                </button>
                <a th:href="@{/designs/{id}(id=${designId})}"
                   class="btn btn-secondary">
                    ✖ Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    function updateCharCounter(textarea) {
        const counter = document.getElementById('childViewCounter');
        const len     = textarea.value.length;

        counter.textContent = len.toLocaleString('de-DE') + ' Zeichen';

        // Warnung ab 100.000 Zeichen (CLOB hat ~4GB)
        counter.classList.remove('warn');
        if (len > 100000) counter.classList.add('warn');
    }

    document.addEventListener('DOMContentLoaded', () => {
        const ta = document.getElementById('childView');
        if (ta) updateCharCounter(ta);
    });
</script>

</body>
</html>
