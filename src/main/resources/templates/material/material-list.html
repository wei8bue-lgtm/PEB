<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.title}">SEP4Eng - Synchronous Engineering Platform</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{css/brand/styles/frontend-kit-complete.css}">
    <link rel="stylesheet" th:href="@{css/brand/styles/brands/bosch/styles/semantic/index.css}">
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <style>
        /* einfaches Layout: Side-Navigation links, Inhalt rechts */
        .app-layout {
            display: flex;
            align-items: flex-start;
        }
        .app-layout__content {
            flex: 1 1 auto;
            min-width: 0;
        }
    </style>
</head>
<body>

    <!-- ── Header (Fragment) ─────────────────────────────────── -->
    <div th:replace="~{fragments/header :: header(#{material.title})}"></div>

    <div class="app-layout">

        <!-- ── Side-Navigation (Fragment) ────────────────────── -->
        <div th:replace="~{fragments/side-navigation :: side-navigation}"></div>

        <div class="app-layout__content">

            <div class="frontend-kit__example-wrapper -secondary">
                <div class="e-container" style="margin: 1rem auto;">
                    <div class="frontend-kit__example-wrapper -primary">
            <div class="container">
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                        <h3 style="margin:0">
                            <span th:text="#{material.heading}">Material</span>
                            (<span th:text="${materials != null ? #lists.size(materials) : 0}">0</span>)
                        </h3>
                        <sec:authorize access="hasAuthority('WRITE')">
                            <button type="button" class="a-button a-button--primary" th:onclick="|window.location.href='@{/materials/new}'|">
                                <i class="a-icon a-button__icon boschicon-bosch-ic-add"></i>
                                <span class="a-button__label" th:text="#{button.newMaterial}">New material</span>
                            </button>
                        </sec:authorize>
                    </div>

                    <form method="get" style="display:flex; gap:.5rem; margin-bottom:1rem;">
                        <div class="a-text-field">
                            <input type="text"
                                   name="search"
                                   th:value="${search}"
                                   th:placeholder="#{material.searchPlaceholder}"
                                   placeholder="Search name / ID / group / specification...">
                        </div>
                        <button type="submit" class="a-button a-button--primary">
                            <i class="a-icon a-button__icon boschicon-bosch-ic-search"></i>
                            <span class="a-button__label" th:text="#{button.searchPlain}">Search</span>
                        </button>
                        <button type="button" class="a-button a-button--primary" th:onclick="|window.location.href='@{/materials}'|">
                            <i class="a-icon a-button__icon boschicon-bosch-ic-reset"></i>
                            <span class="a-button__label" th:text="#{button.reset}">Reset</span>
                        </button>
                    </form>

                    <div style="overflow-x:auto;">
                    <table class="m-table" aria-label="Materials">
                        <thead>
                            <tr>
                                <th th:text="#{label.id}">ID</th>
                                <th th:text="#{label.name}">Bezeichnung</th>
                                <th th:text="#{label.materialGroup}">Werkstoffgruppe</th>
                                <th th:text="#{label.specification}">Spezifikation</th>
                                <th th:text="#{common.status}">Status</th>
                                <th th:text="#{label.releasedRevision}">Freigeg. Rev.</th>
                                <th style="text-align: right;" th:text="#{label.actions}">Aktionen</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${materials == null or #lists.isEmpty(materials)}">
                                <td colspan="7" style="text-align:center; color:#888;" th:text="#{material.noneYet}">
                                    Noch keine Materialien angelegt.
                                </td>
                            </tr>
                            <tr th:each="m : ${materials}">
                                <td th:text="${m.id}"></td>
                                <td><a th:href="@{'/materials/' + ${m.id}}" th:text="${m.name}"></a></td>
                                <td th:text="${m.materialGroup}"></td>
                                <td th:text="${m.specification}"></td>
                                <td th:switch="${m.status}">
                                    <span style="display:inline-flex; align-items:center; gap:.4rem;">
                                        <i th:case="'ACTIVE'" class="a-icon boschicon-bosch-ic-checkmark"></i>
                                        <i th:case="'UNDER_REVIEW'" class="a-icon boschicon-bosch-ic-clock"></i>
                                        <i th:case="'OBSOLETE'" class="a-icon boschicon-bosch-ic-shield-stop"></i>
                                        <i th:case="'BLOCKED'" class="a-icon boschicon-bosch-ic-shield-stop"></i>
                                        <i th:case="*" class="a-icon boschicon-bosch-ic-alert-error"></i>
                                        <span th:if="${m.status != null and m.status.name() == 'ACTIVE'}" th:text="#{material.status.active}"></span>
                                        <span th:if="${m.status != null and m.status.name() == 'UNDER_REVIEW'}" th:text="#{material.status.underReview}"></span>
                                        <span th:if="${m.status != null and m.status.name() == 'OBSOLETE'}" th:text="#{material.status.obsolete}"></span>
                                        <span th:if="${m.status != null and m.status.name() == 'BLOCKED'}" th:text="#{material.status.blocked}"></span>
                                    </span>
                                </td>
                                <td th:text="${m.releasedRevision ?: '–'}"></td>
                                <td style="text-align:right;">
                                    <div class="a-link -icon">
                                        <a th:href="@{'/materials/' + ${m.id}}" target="_self">
                                            <span></span>
                                            <span>[[#{button.details}]]</span>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    </div>
                </div>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/footer :: footer}"></div>

        </div>
    </div>
</body>
</html>
