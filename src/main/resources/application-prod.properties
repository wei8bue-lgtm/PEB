# ══════════════════════════════════════════════════════════════
# PEB - Produktionsprofil
# Aktivieren: --spring.profiles.active=prod
# ══════════════════════════════════════════════════════════════

# ── Datenbank (Prod-Server) ────────────────────────────────────
spring.datasource.url=jdbc:oracle:thin:@//prod-db-server:1521/PEB_PROD
spring.datasource.username=peb_user
spring.datasource.password=peb_user

# ── JPA ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── Logging (minimal für Produktion) ──────────────────────────
logging.level.com.peb=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN