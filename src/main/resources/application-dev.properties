# ══════════════════════════════════════════════════════════════
# PEB - Entwicklungsprofil
# Aktivieren: --spring.profiles.active=dev
# ══════════════════════════════════════════════════════════════

# ── Datenbank (Dev-Server) ─────────────────────────────────────
spring.datasource.url=jdbc:oracle:thin:@//rngvm01428.de.bosch.com:1521/PEB2
spring.datasource.username=peb_user
spring.datasource.password=peb_user

# ── JPA ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── Logging (ausführlich für Entwicklung) ──────────────────────
logging.level.com.peb=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.thymeleaf=DEBUG